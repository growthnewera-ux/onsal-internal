<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온살 앰버서더 관리</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
:root {
 --bg:#f4f5f7; --white:#fff; --border:#e2e4e9; --border2:#d0d3db;
 --text:#111318; --text2:#4a4f5e; --text3:#9098ae;
 --accent:#5b4ef8; --accent-bg:#ede9ff;
 --green:#12a05c; --green-bg:#e6f7ef;
 --red:#e03131; --red-bg:#fff0f0;
 --orange:#d9600a; --orange-bg:#fff3e8;
 --yellow:#b45309; --yellow-bg:#fefce8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ── NAV ── */
.app-header{height:56px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:0;box-shadow:0 1px 4px rgba(0,0,0,.05);position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:var(--text);padding-right:20px;border-right:1px solid var(--border);white-space:nowrap;}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.gnav-link{padding:0 18px;height:56px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--text3);text-decoration:none;border-bottom:3px solid transparent;transition:all .15s;}
.gnav-link:hover{color:var(--text2);}
.gnav-link.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── SUB TABS ── */
.sub-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;}
.sub-tab{padding:13px 18px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--text3);transition:all .15s;white-space:nowrap;}
.sub-tab:hover{color:var(--text2);}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── LAYOUT ── */
.main{padding:24px;max-width:1400px;margin:0 auto;}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.toolbar-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.toolbar-sub{font-size:13px;color:var(--text3);}
.btn-primary{padding:9px 18px;background:var(--accent);color:white;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-primary:hover{background:#4a3de0;box-shadow:0 4px 12px rgba(91,78,248,.3);}
.btn-secondary{padding:8px 14px;background:var(--white);border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-secondary:hover{border-color:var(--border2);color:var(--text);}
.btn-danger{padding:6px 12px;background:var(--red-bg);border:1px solid var(--red);border-radius:7px;font-size:11px;font-weight:700;color:var(--red);cursor:pointer;font-family:inherit;}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.f-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text3);background:var(--white);transition:all .12s;}
.f-chip:hover{border-color:var(--border2);color:var(--text);}
.f-chip.on{background:var(--text);border-color:var(--text);color:white;}

/* ── CANDIDATE GRID ── */
.cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.cand-card{background:var(--white);border-radius:14px;border:1.5px solid var(--border);padding:18px;transition:box-shadow .15s;}
.cand-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.cand-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cand-name{font-size:15px;font-weight:800;color:var(--text);}
.cand-handle{font-size:12px;color:var(--text3);margin-top:2px;}
.status-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;}
.status-reviewing{background:#eff6ff;color:#2563eb;}
.status-contacting{background:var(--yellow-bg);color:var(--yellow);}
.status-contracted{background:var(--green-bg);color:var(--green);}
.status-rejected{background:#f8fafc;color:var(--text3);}
.cand-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.cand-meta-item{background:var(--bg);border-radius:7px;padding:7px 10px;}
.cand-meta-label{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:2px;}
.cand-meta-value{font-size:13px;font-weight:700;color:var(--text);}
.cand-platforms{display:flex;gap:5px;margin-bottom:10px;}
.platform-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;}
.platform-youtube{background:#fee2e2;color:#dc2626;}
.platform-instagram{background:#fdf4ff;color:#9333ea;}
.cand-note{font-size:12px;color:var(--text3);line-height:1.4;margin-bottom:12px;background:var(--bg);padding:7px 10px;border-radius:6px;}
.cand-actions{display:flex;gap:6px;}

/* ── CONTRACTED TABLE ── */
.contracted-section{margin-bottom:32px;}
.amb-profile-card{background:var(--white);border-radius:14px;border:1.5px solid var(--border);padding:20px;margin-bottom:2px;}
.amb-profile-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.amb-profile-left{display:flex;gap:14px;align-items:flex-start;}
.amb-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0;}
.amb-info-name{font-size:16px;font-weight:800;color:var(--text);}
.amb-info-handle{font-size:12px;color:var(--text3);margin-top:2px;}
.amb-info-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.amb-info-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--text2);}
.mission-table-wrap{background:var(--white);border-radius:0 0 14px 14px;border:1.5px solid var(--border);border-top:none;overflow-x:auto;}
.mission-table{width:100%;border-collapse:collapse;min-width:900px;}
.mission-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;background:#fafbfc;border-bottom:1px solid var(--border);white-space:nowrap;}
.mission-table td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.mission-table tr:last-child td{border-bottom:none;}
.mission-table tr:hover td{background:#fafbff;}
.mission-status{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;}
.ms-planned{background:#eff6ff;color:#2563eb;}
.ms-inprogress{background:var(--yellow-bg);color:var(--yellow);}
.ms-published{background:var(--green-bg);color:var(--green);}
.ms-verified{background:#f5f3ff;color:#7c3aed;}
.mission-edit-btn{font-size:11px;padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;cursor:pointer;color:var(--text2);font-family:inherit;}
.mission-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.mission-url-link{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;}
.mission-url-link:hover{text-decoration:underline;}

/* ── EMPTY STATE ── */
.empty-state{background:var(--white);border-radius:14px;border:1.5px dashed var(--border2);padding:60px;text-align:center;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty-desc{font-size:13px;color:var(--text3);}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:var(--white);border-radius:18px;border:1.5px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.14);width:520px;max-height:90vh;overflow-y:auto;}
.modal-header{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-.4px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:4px;}
.modal-body{padding:20px 24px 24px;}
.form-row{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;font-weight:500;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,78,248,.1);}
.form-textarea{resize:vertical;min-height:80px;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.platform-checkboxes{display:flex;gap:8px;}
.plat-check{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .12s;}
.plat-check input{display:none;}
.plat-check.selected-yt{border-color:#dc2626;background:#fee2e2;color:#dc2626;}
.plat-check.selected-ig{border-color:#9333ea;background:#fdf4ff;color:#9333ea;}
.plat-check.selected-tt{border-color:#000;background:#f0f0f0;color:#000;}
.modal-footer{display:flex;gap:8px;margin-top:20px;}
.btn-modal-cancel{flex:1;padding:12px;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-modal-ok{flex:2;padding:12px;background:var(--accent);border:none;border-radius:9px;color:white;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-modal-ok:hover{background:#4a3de0;}

/* stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}

/* ── 제품 카드 ── */
.product-card{background:var(--white);border-radius:12px;border:1.5px solid var(--border);padding:16px;transition:box-shadow .15s;}
.product-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);}
.pc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.pc-name{font-size:14px;font-weight:800;color:var(--text);}
.pc-cat{font-size:10px;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:8px;border:1px solid var(--border);font-weight:600;}
.pc-prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.pc-price-item{background:var(--bg);border-radius:7px;padding:8px 10px;}
.pc-price-label{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:2px;}
.pc-price-val{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.pc-margin{font-size:11px;color:var(--green);font-weight:700;margin-bottom:8px;}
.pc-actions{display:flex;gap:6px;}

/* ── 월별 운영 테이블 ── */
.mo-month-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text3);background:var(--white);transition:all .15s;}
.mo-month-btn:hover{border-color:var(--border2);color:var(--text);}
.mo-month-btn.active{background:var(--accent);border-color:var(--accent);color:white;}
.mo-sum-card{background:var(--white);border-radius:10px;padding:12px 16px;border:1.5px solid var(--border);}
.mo-sum-label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.mo-sum-val{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.mo-table-wrap{overflow-x:auto;}
.mo-table{width:100%;border-collapse:collapse;min-width:1100px;}
.mo-table th{padding:9px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;background:#fafbfc;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;}
.mo-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.mo-table tr:last-child td{border-bottom:none;}
.mo-table tr:hover td{background:#fafbff;}
/* inline input cells */
.mo-input{background:transparent;border:none;border-bottom:1px solid transparent;width:100%;font-size:12px;color:var(--text);outline:none;font-family:inherit;padding:2px 2px;transition:border-color .12s;min-width:60px;}
.mo-input:focus{border-bottom-color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:2px 5px;}
.mo-input::placeholder{color:var(--text3);}
.mo-select{background:transparent;border:none;font-size:12px;color:var(--text);outline:none;font-family:inherit;cursor:pointer;width:100%;}
.mo-check{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}
.mo-amb-cell{display:flex;align-items:center;gap:8px;min-width:130px;}
.mo-amb-pic{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--accent);}
.mo-amb-info{min-width:0;}
.mo-amb-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;}
.mo-amb-handle{font-size:10px;color:var(--text3);}
.mo-pay-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;cursor:pointer;}
.mo-pay-unpaid {background:#fff0f0;color:#e03131;}
.mo-pay-pending{background:#fff3e8;color:#d9600a;}
.mo-pay-paid {background:#e6f7ef;color:#12a05c;}
.mo-status-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;}
.mo-st-planned {background:#eff6ff;color:#2563eb;}
.mo-st-inprogress{background:#fefce8;color:#b45309;}
.mo-st-published {background:#e6f7ef;color:#12a05c;}
.mo-st-verified {background:#f5f3ff;color:#7c3aed;}
.mo-link-btn{font-size:10px;font-weight:700;color:var(--accent);text-decoration:none;padding:2px 6px;background:var(--accent-bg);border-radius:4px;white-space:nowrap;}

/* ── 인라인 편집 ── */
.ct-inline{background:transparent;border:none;border-bottom:1px solid transparent;width:100%;font-size:13px;color:var(--text);outline:none;font-family:inherit;padding:2px 3px;transition:all .12s;}
.ct-inline:hover{border-bottom-color:var(--border2);}
.ct-inline:focus{border-bottom-color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:2px 6px;}
.ct-inline::placeholder{color:var(--text3);}
.ct-status-sel{background:transparent;border:none;font-size:11px;font-weight:700;cursor:pointer;outline:none;font-family:inherit;padding:3px 7px;border-radius:7px;}
.ct-text-del{font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}
.ct-text-del:hover{color:var(--red);}
/* 앰버서더 확장 row */
.amb-expand-inner{padding:14px 18px;background:#fafbff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.ae-field{display:flex;flex-direction:column;gap:4px;}
.ae-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.ae-input{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--text);outline:none;font-family:inherit;}
.ae-input:focus{border-color:var(--accent);}
.ae-link{font-size:11px;color:var(--accent);font-weight:700;word-break:break-all;}

/* ── 후보풀 테이블 ── */
.cand-table-wrap{background:var(--white);border-radius:12px;border:1.5px solid var(--border);overflow:hidden;}
.cand-table{width:100%;border-collapse:collapse;}
.cand-table th{padding:9px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;background:#fafbfc;border-bottom:1px solid var(--border);white-space:nowrap;}
.cand-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.cand-table tr:last-child td{border-bottom:none;}
.cand-table tr:hover td{background:#fafbff;}
.ct-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--accent);flex-shrink:0;}
.ct-name{font-size:13px;font-weight:700;color:var(--text);}
.ct-handle{font-size:11px;color:var(--text3);}

/* ── 계약앰버서더 계약정보 ── */
.contract-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.contract-card{background:var(--white);border-radius:13px;border:1.5px solid var(--border);overflow:hidden;}
.cc-profile{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);background:#fafbfc;}
.cc-fields{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.cf-row{display:flex;align-items:flex-start;gap:8px;}
.cf-label{font-size:11px;font-weight:700;color:var(--text3);width:72px;flex-shrink:0;padding-top:3px;}
.cf-input{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s;}
.cf-input:focus{border-color:var(--accent);}
.cf-link{font-size:12px;color:var(--accent);font-weight:700;text-decoration:none;}
.cf-link:hover{text-decoration:underline;}
.cc-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end;}

/* ── 캘린더 ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-size:16px;font-weight:800;color:var(--text);}
.cal-nav-btn{background:var(--white);border:1.5px solid var(--border);border-radius:7px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.cal-grid{background:var(--white);border-radius:12px;border:1.5px solid var(--border);overflow:hidden;}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfc;border-bottom:1px solid var(--border);}
.cal-day-name{padding:9px;text-align:center;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.cal-cells{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:80px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:top;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.other-month{background:#fafbfc;}
.cal-cell.today{background:var(--accent-bg);}
.cal-date{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;}
.cal-cell.other-month .cal-date{color:var(--text3);}
.cal-event{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.cal-legend-dot{width:10px;height:10px;border-radius:3px;}
.mo-empty{padding:40px;text-align:center;color:var(--text3);font-size:13px;}
.stat-card{background:var(--white);border-radius:12px;padding:16px 18px;border:1.5px solid var(--border);}
.stat-label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.stat-val{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.6px;}
</style>
</head>
<body>

<header class="app-header">
 <div class="logo"><div class="logo-mark"></div>온살 마케팅</div>
 <nav id="globalNav"></nav>
</header>

<div class="sub-tabs">
 <div class="sub-tab active" id="tab-candidates" onclick="setSubTab('candidates')">후보풀</div>

<script>
const MONTHS = ['7월','8월','9월','10월','11월','12월'];
const CAND_KEY = 'onsal_candidates_v1';
const PROD_KEY = 'onsal_products_v1';
const AMB_KEY = 'onsal_ambassadors_v1';

let candidates = JSON.parse(localStorage.getItem(CAND_KEY) || 'null');
let ambassadors = JSON.parse(localStorage.getItem(AMB_KEY) || '[]');
let products = JSON.parse(localStorage.getItem(PROD_KEY) || '[]');

// 최초 실행 시 인스타 후보 4명 기본 데이터 삽입
if (!candidates) {
 candidates = [
 { id:'seed-1', name:'xsxzxe', handle:'@xsxzxe', url:'https://www.instagram.com/xsxzxe/', platforms:['ig'], category:'', igFollowers:'', ytSubs:'', ttFollowers:'', fee:0, status:'reviewing', note:'', addedAt:new Date().toISOString() },
 { id:'seed-2', name:'lim2da', handle:'@lim2da', url:'https://www.instagram.com/lim2da/', platforms:['ig'], category:'', igFollowers:'', ytSubs:'', ttFollowers:'', fee:0, status:'reviewing', note:'', addedAt:new Date().toISOString() },
 { id:'seed-3', name:'y0ngsunj', handle:'@y0ngsunj', url:'https://www.instagram.com/y0ngsunj/', platforms:['ig'], category:'', igFollowers:'', ytSubs:'', ttFollowers:'', fee:0, status:'reviewing', note:'', addedAt:new Date().toISOString() },
 { id:'seed-4', name:'jinkyuvogue', handle:'@jinkyuvogue', url:'https://www.instagram.com/jinkyuvogue/', platforms:['ig'], category:'', igFollowers:'', ytSubs:'', ttFollowers:'', fee:0, status:'reviewing', note:'', addedAt:new Date().toISOString() },
 ];
 localStorage.setItem(CAND_KEY, JSON.stringify(candidates));
}

let editingCandId = null;
let editingAmbId = null;
let editingMission = null; // {ambId, month}
let activeCandFilter = '전체';
let activeCandCatFilter = '전체';
let activeSubTab = 'candidates';
let aPlats = {yt:false, ig:false, tt:false};
let cPlats = {yt:false, ig:false, tt:false};

const save = () => {
 localStorage.setItem(CAND_KEY, JSON.stringify(candidates));
 localStorage.setItem(AMB_KEY, JSON.stringify(ambassadors));
 localStorage.setItem(PROD_KEY, JSON.stringify(products));
};
const fmt = n => parseInt(n||0).toLocaleString('ko-KR');

// ── SUB TABS ──
let activeMonthlyMonth = MONTHS[0];

function setSubTab(t) {
 activeSubTab = t;
 ['candidates','contracted','monthly'].forEach(id => {
 document.getElementById('tab-'+id)?.classList.toggle('active', t===id);
 const v = document.getElementById('view-'+id);
 if(v) v.style.display = t===id ? '' : 'none';
 });
 if (t==='contracted') renderAmbs();
 else if (t==='monthly') renderMonthlyView();

 else renderCands();
}

// ── STATUS HELPERS ──
const CAND_STATUS = {
 reviewing: { label:'검토중', cls:'status-reviewing' },
 contacting: { label:'연락중', cls:'status-contacting' },
 contracted: { label:'계약완료', cls:'status-contracted' },
 rejected: { label:'거절/보류',cls:'status-rejected' },
};
const MISS_STATUS = {
 planned: { label:'예정', cls:'ms-planned' },
 inprogress: { label:'진행중', cls:'ms-inprogress' },
 published: { label:'게시완료', cls:'ms-published' },
 verified: { label:'확인완료', cls:'ms-verified' },
};
const CONTENT_LABELS = {
 yt_long:'유튜브 롱폼', yt_shorts:'유튜브 쇼츠', ig_reel:'인스타 릴스',
 ig_feed:'인스타 피드', yt_ig:'유튜브+인스타'
};

// ── CANDIDATES ──
function renderCands() {
 const filters = ['전체','검토중','연락중','계약완료','거절/보류'];
 document.getElementById('cand-filters').innerHTML =
 `<span style="font-size:10px;font-weight:700;color:var(--text3);align-self:center;margin-right:2px">상태</span>` +
 filters.map(f => `<span class="f-chip ${f===activeCandFilter?'on':''}" onclick="setCandFilter('${f}')">${f}</span>`).join('');

 const allCats = ['전체', ...new Set(candidates.map(c => c.category).filter(Boolean))];
 document.getElementById('cand-cat-filters').innerHTML =
 `<span style="font-size:10px;font-weight:700;color:var(--text3);align-self:center;margin-right:2px">카테고리</span>` +
 allCats.map(c => `<span class="f-chip ${c===activeCandCatFilter?'on':''}" onclick="setCandCatFilter('${c}')">${c}</span>`).join('');

 const filterMap = {'전체':null,'검토중':'reviewing','연락중':'contacting','계약완료':'contracted','거절/보류':'rejected'};
 const filtered = candidates.filter(c => {
 if (activeCandFilter !== '계약완료' && c.status === 'contracted') return false;
 const matchStatus = activeCandFilter==='전체' || c.status === filterMap[activeCandFilter];
 const matchCat = activeCandCatFilter==='전체' || c.category === activeCandCatFilter;
 return matchStatus && matchCat;
 });

 document.getElementById('cand-count').textContent = `총 ${filtered.length}명`;
 const tbody = document.getElementById('cand-tbody');
 if (filtered.length === 0) {
 tbody.innerHTML = `<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--text3);font-size:13px">후보가 없어요 · 우상단 버튼으로 추가하세요</td></tr>`;
 return;
 }

 const platMap = {
 yt:{ label:' 유튜브', bg:'#fee2e2', col:'#dc2626' },
 ig:{ label:' 인스타', bg:'#fdf4ff', col:'#9333ea' },
 tt:{ label:' 틱톡', bg:'#f0f0f0', col:'#333' },
 };

 tbody.innerHTML = filtered.map(c => {
  const igHandle = (c.igUrl||'').match(/instagram\.com\/([^/?#]+)/)?.[1]||'';
  const pic = igHandle
    ? `<img src="https://unavatar.io/instagram/${igHandle.replace(/\//g,'')}" onerror="this.outerHTML='<div class=\\'ct-avatar\\'>${c.name[0]}</div>'" style="width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0" loading="lazy">`
    : `<div class="ct-avatar">${c.name[0]}</div>`;
  const plats = (c.platforms||[]).map(p => {
    const m = platMap[p]; if(!m) return '';
    return `<span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:${m.bg};color:${m.col};white-space:nowrap">${m.label}</span>`;
  }).join(' ');
  // 인스타 핸들 → 링크
  const igUrl = c.igUrl||'';
  const handleEl = igUrl
    ? `<a href="${igUrl}" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none">${c.handle||''}</a>`
    : `<span style="font-size:11px;color:var(--text3)">${c.handle||''}</span>`;
  // 상태 색상
  const stColors = {
    reviewing: 'background:#eff6ff;color:#2563eb',
    contacting: 'background:#fefce8;color:#b45309',
    contracted: 'background:#e6f7ef;color:#12a05c',
    rejected:   'background:#f8fafc;color:#9098ae'
  };
  const stCol = stColors[c.status||'reviewing'];
  return `<tr>
    <td style="width:200px">
      <div style="display:flex;align-items:center;gap:9px">
        ${pic}
        <div>
          <input class="ct-inline" value="${c.name}" style="font-weight:700;font-size:13px;width:110px" onchange="updateCand('${c.id}','name',this.value)">
          ${handleEl}
        </div>
      </div>
    </td>
    <td style="width:90px">${plats}</td>
    <td style="width:100px"><input class="ct-inline" value="${c.category||''}" placeholder="카테고리" style="width:90px" onchange="updateCand('${c.id}','category',this.value)"></td>
    <td style="width:90px"><input class="ct-inline" value="${c.igFollowers||c.ytSubs||''}" placeholder="팔로워" style="width:80px" onchange="updateCand('${c.id}','igFollowers',this.value)"></td>
    <td style="width:90px;text-align:right"><input class="ct-inline" type="number" value="${c.fee||''}" placeholder="0" style="width:60px;text-align:right" onchange="updateCand('${c.id}','fee',this.value)"><span style="font-size:11px;color:var(--text3)"> 만</span></td>
    <td style="width:110px">
      <select class="ct-status-sel" style="${stCol};border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer;outline:none;font-family:inherit;border:none" onchange="updateCandStatus('${c.id}',this.value)">
        <option value="reviewing"  ${(c.status||'reviewing')==='reviewing' ?'selected':''}>검토중</option>
        <option value="contacting" ${c.status==='contacting'              ?'selected':''}>연락중</option>
        <option value="contracted"                                                       >→ 계약전환</option>
        <option value="rejected"   ${c.status==='rejected'                ?'selected':''}>거절/보류</option>
      </select>
    </td>
    <td style="width:50px;text-align:center">
      <button style="background:none;border:none;font-size:12px;color:var(--text3);cursor:pointer;font-family:inherit;padding:0" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--text3)'" onclick="deleteCand('${c.id}')">삭제</button>
    </td>
  </tr>`;
 }).join('');
}

function updateCand(id, field, value) {

}

 igFollowers: document.getElementById('c-ig-followers')?.value.trim() || '',

 ttFollowers: document.getElementById('c-tt-followers')?.value.trim() || '',

 fee: document.getElementById('c-fee').value || 0,

 };

 ytUrl: c.ytUrl||'', igUrl: c.igUrl||'', ttUrl: c.ttUrl||'',

 };
 MONTHS.forEach(m => { amb.missions[m] = { product:'', contentType:'yt_ig', guide:'', ytUrl:'', igUrl:'', deadline:'', status:'planned', note:'' }; });

 : '<span style="font-size:11px;color:var(--text3)">' + (a.handle||'') + '</span>';

 let expiryBadge = '';

 }
 // 날짜 포맷
 const fmtDate = d => d ? (d.length === 10 ? d : d.slice(0,7)) : '미설정';

 rows += '<tr style="cursor:pointer" onclick="toggleAmbExpand(\'' + a.id + '\')">' +

function renderMonthlyCalendar(month) {
 const monthIdx = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'].indexOf(month);
 if (monthIdx < 0) return '<div></div>';
 const year = new Date().getFullYear();
 const today = new Date();
 const firstDay = new Date(year, monthIdx, 1).getDay();
 const daysInMonth = new Date(year, monthIdx+1, 0).getDate();

 const events = {};
 const colors = ['#5b4ef8','#2563eb','#15803d','#c2410c','#be185d','#b45309','#7c3aed','#0891b2'];
 ambassadors.forEach((a, idx) => {
 const col = colors[idx % colors.length];
 const mis = a.missions?.[month] || {};
 [[mis.uploadDate,'업로드'],[mis.deadline,'마감']].forEach(([date, type]) => {
 if (!date) return;
 const d = new Date(date);
 if (d.getMonth() !== monthIdx || d.getFullYear() !== year) return;
 const key = d.getDate();
 if (!events[key]) events[key] = [];
 events[key].push({name:a.name.slice(0,5), type, col});
 });
 });

 const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
 let cells = '';
 for (let i = 0; i < totalCells; i++) {
 const day = i - firstDay + 1;
 const isOther = day < 1 || day > daysInMonth;
 const isToday = !isOther && day === today.getDate() && monthIdx === today.getMonth() && year === today.getFullYear();
 const evs = !isOther && events[day] ? events[day] : [];
 cells += '<div style="min-height:64px;padding:5px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);' + (isOther?'background:#fafbfc;':'') + (isToday?'background:var(--accent-bg);':'') + '">' +
 '<div style="font-size:11px;font-weight:700;color:' + (isOther?'var(--text3)':isToday?'var(--accent)':'var(--text)') + ';margin-bottom:3px">' + (isOther?'':day) + '</div>' +
 evs.map(e => '<div style="font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;margin-bottom:2px;background:' + e.col + '18;color:' + e.col + ';border-left:2px solid ' + e.col + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + e.name + ' ' + e.type + '">' + e.name + ' <span style=\'opacity:.7\'>' + e.type + '</span></div>').join('') +
 '</div>';
 }

 const dayNames = ['일','월','화','수','목','금','토'];
 return '<div style="background:var(--white);border-radius:12px;border:1.5px solid var(--border);overflow:hidden;margin-top:20px">' +
 '<div style="padding:12px 16px;border-bottom:1px solid var(--border);background:#fafbfc;display:flex;justify-content:space-between;align-items:center">' +
 '<span style="font-size:14px;font-weight:700;color:var(--text)">' + month + ' 업로드 캘린더</span>' +
 '<span style="font-size:11px;color:var(--text3)">업로드 예정일 · 마감일 자동 표시</span>' +
 '</div>' +
 '<div style="display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfc;border-bottom:1px solid var(--border)">' +
 dayNames.map(d => '<div style="padding:8px;text-align:center;font-size:10px;font-weight:700;color:var(--text3)">' + d + '</div>').join('') +
 '</div>' +
 '<div style="display:grid;grid-template-columns:repeat(7,1fr)">' + cells + '</div>' +
 '<div style="padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap">' +
 ambassadors.map((a,i) => '<span style="font-size:10px;display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:3px;background:' + colors[i%colors.length] + ';display:inline-block"></span>' + a.name + '</span>').join('') +
 '</div>' +
 '</div>';
}

function saveMO(ambId, month, field, value) {
 const a = ambassadors.find(x => x.id === ambId);
 if (!a) return;
 if (!a.missions) a.missions = {};
 if (!a.missions[month]) a.missions[month] = {};
 a.missions[month][field] = value;
 save();
 // 요약만 재렌더 (테이블 전체 재렌더 안 함 — 입력 포커스 유지)
 const month2 = activeMonthlyMonth;
 const total = ambassadors.length;
 const shipped = ambassadors.filter(a => a.missions?.[month2]?.shipped).length;
 const posted = ambassadors.filter(a => { const m=a.missions?.[month2]; return m?.igUrl||m?.ytUrl||m?.postUrl; }).length;
 const paid = ambassadors.filter(a => a.missions?.[month2]?.payStatus==='paid').length;
 const totalFee= ambassadors.reduce((s,a) => s + (+a.missions?.[month2]?.payAmount||0), 0);
 document.getElementById('monthly-summary').innerHTML = [
 ['앰버서더', total+'명', ''],
 ['제품 발송', shipped+'/'+total+'명', shipped===total?'#12a05c':'#d9600a'],
 ['게시 완료', posted+'/'+total+'명', posted===total?'#12a05c':'#d9600a'],
 ['지급 완료', paid+'/'+total+'명', paid===total?'#12a05c':'#d9600a'],
 ['총 광고비', totalFee?fmt(totalFee)+'만원':'–', ''],
 ].map(([l,v,c]) => `<div class="mo-sum-card"><div class="mo-sum-label">${l}</div><div class="mo-sum-val" style="${c?'color:'+c:''}">${v}</div></div>`).join('');
}

function exportMonthlyCSV() {
 const month = activeMonthlyMonth;
 const headers = ['앰버서더','핸들','플랫폼','광고 제품','무상 제품','발송','게시글 URL','이름','연락처','우편번호','주소','광고비(만원)','지급 상태','진행 상태'];
 const platLbl = {yt:'유튜브',ig:'인스타',tt:'틱톡'};
 const payLbl = {unpaid:'미지급',pending:'지급예정',paid:'지급완료'};
 const stLbl = {guideline:'가이드 전달',waiting:'검토 대기',posted:'게시완료',paid_done:'정산완료'};
 const rows = ambassadors.map(a => {
 const m = a.missions?.[month] || {};
 const postUrl = m.postUrl||m.igUrl||m.ytUrl||'';
 return [
 a.name, a.handle||'',
 (a.platforms||[]).map(p=>platLbl[p]||p).join('/'),
 m.product||'', m.freeProducts||'', m.shipped?'':'',
 postUrl, m.deliveryName||'', m.deliveryPhone||'',
 m.deliveryZip||'', m.deliveryAddress||'',
 m.payAmount||'', payLbl[m.payStatus||'unpaid'], stLbl[m.status||'planned']
 ];
 });
 const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
 const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
 const link = document.createElement('a');
 link.href = URL.createObjectURL(blob);
 link.download = `앰버서더_${month}_운영현황.csv`;
 link.click();
}

 <div class="product-card">
 <div class="pc-header">
 <div class="pc-name">${p.name}${p.size?' <span style="font-size:11px;color:var(--text3);font-weight:500">('+p.size+')</span>':''}</div>
 <span class="pc-cat">${p.category||'미분류'}</span>
 </div>
 <div class="pc-prices">
 <div class="pc-price-item">
 <div class="pc-price-label">원가</div>
 <div class="pc-price-val">${p.costPrice?Number(p.costPrice).toLocaleString()+'원':'–'}</div>
 </div>
 <div class="pc-price-item">
 <div class="pc-price-label">소비자가</div>
 <div class="pc-price-val">${p.retailPrice?Number(p.retailPrice).toLocaleString()+'원':'–'}</div>
 </div>
 </div>
 ${margin!==null ? `<div class="pc-margin">마진율 ${margin}%</div>` : ''}
 ${p.note ? `<div style="font-size:11px;color:var(--text3);margin-bottom:10px;background:var(--bg);padding:5px 8px;border-radius:5px"> ${p.note}</div>` : ''}
 <div class="pc-actions">
 <button class="btn-secondary" onclick="openProductModal('${p.id}')">편집</button>
 <button class="btn-danger" onclick="deleteProduct('${p.id}')">삭제</button>
 </div>
 </div>`;
 }).join('');
}

function openProductModal(id) {
 editingProductId = id || null;
 const p = id ? products.find(x=>x.id===id) : null;
 document.getElementById('product-modal-title').textContent = id ? '제품 편집' : '제품 추가';
 document.getElementById('p-name').value = p?.name || '';
 document.getElementById('p-category').value = p?.category || '';
 document.getElementById('p-cost').value = p?.costPrice || '';
 document.getElementById('p-retail').value = p?.retailPrice || '';
 document.getElementById('p-size').value = p?.size || '';
 document.getElementById('p-note').value = p?.note || '';
 document.getElementById('productOverlay').classList.add('show');
}
function closeProductModal() { document.getElementById('productOverlay').classList.remove('show'); }

function saveProduct() {
 const name = document.getElementById('p-name').value.trim();
 if (!name) return alert('제품명을 입력해주세요');
 const data = {
 id: editingProductId || Date.now().toString(),
 name,
 category: document.getElementById('p-category').value.trim(),
 costPrice: +document.getElementById('p-cost').value || 0,
 retailPrice: +document.getElementById('p-retail').value || 0,
 size: document.getElementById('p-size').value.trim(),
 note: document.getElementById('p-note').value.trim(),
 };
 if (editingProductId) products = products.map(p => p.id===editingProductId ? data : p);
 else products.push(data);
 save(); closeProductModal(); renderProducts();
}

function deleteProduct(id) {
 if (!confirm('삭제할까요?')) return;
 products = products.filter(p => p.id !== id);
 save(); renderProducts();
}

// ── 캘린더 ──────────────────────────────────────────────
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed

function renderCalendar() {
 const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
 document.getElementById('cal-title').textContent = `${calYear}년 ${monthNames[calMonth]}`;

 const firstDay = new Date(calYear, calMonth, 1).getDay();
 const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
 const today = new Date();

 // 각 앰버서더의 이번달 업로드 예정일 (deadline / uploadDate 활용)
 const MONTH_KR = monthNames[calMonth]; // e.g. '7월'
 const events = {}; // date → [{name, color}]
 const colors = ['#5b4ef8','#2563eb','#15803d','#c2410c','#be185d','#b45309','#7c3aed'];
 ambassadors.forEach((a, idx) => {
 const col = colors[idx % colors.length];
 const mis = a.missions?.[MONTH_KR];
 if (!mis) return;
 // deadline
 if (mis.deadline) {
 const d = new Date(mis.deadline);
 if (d.getMonth() === calMonth && d.getFullYear() === calYear) {
 const key = d.getDate();
 if (!events[key]) events[key] = [];
 events[key].push({ name: a.name, color: col, type: '마감' });
 }
 }
 // uploadDate
 if (mis.uploadDate) {
 const d = new Date(mis.uploadDate);
 if (d.getMonth() === calMonth && d.getFullYear() === calYear) {
 const key = d.getDate();
 if (!events[key]) events[key] = [];
 events[key].push({ name: a.name, color: col, type: '업로드' });
 }
 }
 });

 // 셀 렌더
 let cells = '';
 const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
 for (let i = 0; i < totalCells; i++) {
 const day = i - firstDay + 1;
 const isOther = day < 1 || day > daysInMonth;
 const isToday = !isOther && day === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
 const evs = (!isOther && events[day]) ? events[day] : [];
 cells += `<div class="cal-cell ${isOther?'other-month':''} ${isToday?'today':''}">
 <div class="cal-date">${isOther ? '' : day}</div>
 ${evs.map(e => `<div class="cal-event" style="background:${e.color}18;color:${e.color};border-left:2px solid ${e.color}" title="${e.name} ${e.type}">${e.name.slice(0,5)} <span style="opacity:.7">${e.type}</span></div>`).join('')}
 </div>`;
 }
 document.getElementById('calCells').innerHTML = cells;

 // 범례
 const legendAmbs = ambassadors.map((a,i) => ({name:a.name, color:colors[i%colors.length]}));
 document.getElementById('calLegend').innerHTML = legendAmbs.map(a =>
 `<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${a.color}"></div>${a.name}</div>`
 ).join('');
}
function calPrev() { if(calMonth===0){calYear--;calMonth=11;}else calMonth--; renderCalendar(); }
function calNext() { if(calMonth===11){calYear++;calMonth=0;}else calMonth++; renderCalendar(); }

// overlays close on backdrop click
['candOverlay','ambOverlay','missionOverlay'].forEach(id => {
 document.getElementById(id).addEventListener('click', e => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('show'); });
});

renderCands();
</script>
</body>
</html>
