<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온살 마케팅 예산 플래너</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; }

header { background: #1d1d1f; color: white; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 50; }
header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.hbar { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.hitem label { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }
.hitem .hval { font-size: 16px; font-weight: 700; }
.hval.over { color: #ff4d4d; }
.hval.ok { color: #34c759; }
.budget-input { background: transparent; border: none; border-bottom: 1px solid #444; color: white; font-size: 16px; font-weight: 700; width: 80px; text-align: right; outline: none; }

.layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 57px); }

.left { background: white; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; overflow: hidden; }
.left-head { padding: 14px 18px; border-bottom: 1px solid #e5e5e5; }
.left-head h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #333; }
.search-wrap input { width: 100%; padding: 7px 12px; border: 1px solid #ddd; border-radius: 7px; font-size: 12px; outline: none; }
.search-wrap input:focus { border-color: #007aff; }

.cat-tabs { display: flex; border-bottom: 1px solid #e5e5e5; overflow-x: auto; flex-shrink: 0; background: #fafafa; }
.cat-tab { padding: 10px 13px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; color: #888; white-space: nowrap; transition: all 0.15s; }
.cat-tab.active { color: #007aff; border-bottom-color: #007aff; font-weight: 600; background: white; }

.item-list { overflow-y: auto; flex: 1; }

.inf-card { padding: 11px 18px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
.inf-card:hover { background: #f5f5f7; }
.inf-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
.inf-name { font-size: 13px; font-weight: 600; }
.inf-cat-badge { font-size: 10px; color: #888; background: #f0f0f0; padding: 2px 6px; border-radius: 10px; }
.price-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.pchip { font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid #e5e5e5; background: white; white-space: nowrap; color: #555; }

.fixed-card { padding: 14px 18px; border-bottom: 1px solid #f0f0f0; }
.fixed-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.fixed-desc { font-size: 11px; color: #888; margin-bottom: 10px; }
.fixed-fields { display: flex; flex-direction: column; gap: 8px; }
.field-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field-row label { font-size: 11px; color: #888; width: 80px; flex-shrink: 0; }
.field-row input[type=number], .field-row input[type=text] { border: 1px solid #ddd; border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; }
.field-row input[type=number]:focus, .field-row input[type=text]:focus { border-color: #007aff; }
.w60 { width: 60px; }
.w80 { width: 80px; }
.w120 { width: 120px; }
.field-row select { border: 1px solid #ddd; border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; }
.calc-preview { font-size: 11px; color: #007aff; font-weight: 600; }
.btn-add-fixed { margin-top: 10px; width: 100%; padding: 8px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-add-fixed:hover { background: #0066dd; }

.right { display: flex; flex-direction: column; overflow: hidden; }
.month-tabs { display: flex; background: white; border-bottom: 1px solid #e5e5e5; padding: 0 20px; overflow-x: auto; flex-shrink: 0; }
.mtab { padding: 13px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; color: #888; transition: all 0.15s; }
.mtab.active { color: #007aff; border-bottom-color: #007aff; font-weight: 600; }
.mbadge { font-size: 10px; background: #007aff; color: white; border-radius: 10px; padding: 1px 5px; margin-left: 4px; }

.month-body { flex: 1; overflow-y: auto; padding: 18px; }

.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.scard { background: white; border-radius: 10px; padding: 14px 16px; border: 1px solid #e5e5e5; }
.scard .slabel { font-size: 10px; color: #888; margin-bottom: 3px; }
.scard .sval { font-size: 17px; font-weight: 700; }
.scard .sval.over { color: #ff4d4d; }

.plan-section { background: white; border-radius: 10px; border: 1px solid #e5e5e5; overflow: hidden; margin-bottom: 14px; }
.plan-section-head { padding: 12px 18px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
.plan-section-head h3 { font-size: 13px; font-weight: 600; }
.section-total { font-size: 12px; color: #555; font-weight: 600; }
.empty-msg { padding: 28px; text-align: center; color: #bbb; font-size: 12px; }

table { width: 100%; border-collapse: collapse; }
th { padding: 9px 14px; text-align: left; font-size: 10px; font-weight: 600; color: #888; background: #f9f9f9; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
td { padding: 10px 14px; font-size: 12px; border-bottom: 1px solid #f7f7f7; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.del-btn { background: none; border: none; color: #ddd; cursor: pointer; font-size: 14px; padding: 2px 5px; border-radius: 4px; }
.del-btn:hover { color: #ff4d4d; background: #fff0f0; }
.type-badge { font-size: 10px; padding: 2px 7px; border-radius: 8px; display: inline-block; white-space: nowrap; }
.badge-inf   { background: #e8f4fd; color: #0a84ff; }
.badge-amb   { background: #fef3e8; color: #ff9500; }
.badge-exp   { background: #e8fdf0; color: #30d158; }
.badge-ad    { background: #f3e8fe; color: #bf5af2; }
.badge-viral { background: #fde8e8; color: #ff3b30; }
.badge-ops   { background: #f0f0f0; color: #888; }
.trow-total td { font-weight: 700; background: #f9f9f9; border-top: 2px solid #e5e5e5; }
.memo-inp { border: none; background: transparent; font-size: 11px; color: #aaa; width: 110px; outline: none; }
.memo-inp:focus { background: #f5f5f7; border-radius: 4px; padding: 2px 4px; color: #555; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: center; justify-content: center; }
.overlay.show { display: flex; }
.modal { background: white; border-radius: 14px; padding: 24px; width: 340px; box-shadow: 0 16px 48px rgba(0,0,0,0.18); }
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.modal .msub { font-size: 11px; color: #888; margin-bottom: 18px; }
.modal label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 5px; color: #555; }
.modal select, .modal input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 12px; margin-bottom: 12px; outline: none; }
.modal select:focus, .modal input[type=text]:focus { border-color: #007aff; }
.price-box { background: #f5f5f7; border-radius: 8px; padding: 12px; margin-bottom: 14px; text-align: center; }
.price-box .pb-label { font-size: 10px; color: #888; }
.price-box .pb-main { font-size: 20px; font-weight: 700; }
.price-box .pb-vat { font-size: 11px; color: #888; margin-top: 2px; }
.mbtns { display: flex; gap: 8px; }
.mbtn-cancel { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 7px; background: white; font-size: 12px; cursor: pointer; }
.mbtn-ok { flex: 2; padding: 10px; border: none; border-radius: 7px; background: #007aff; color: white; font-size: 12px; font-weight: 600; cursor: pointer; }
.mbtn-ok:hover { background: #0066dd; }
</style>
</head>
<body>

<header>
  <h1>🌿 온살 마케팅 예산 플래너</h1>
  <div class="hbar">
    <div class="hitem">
      <label>총 예산</label>
      <span class="hval"><input class="budget-input" id="budgetInput" type="number" value="100000">만원</span>
    </div>
    <div class="hitem">
      <label>집행 합계 (VAT포함)</label>
      <span class="hval ok" id="hSpent">0만원</span>
    </div>
    <div class="hitem">
      <label>잔여</label>
      <span class="hval ok" id="hRemain">100,000만원</span>
    </div>
  </div>
</header>

<div class="layout">
  <div class="left">
    <div class="left-head">
      <h2>항목 추가</h2>
      <div id="infSearchWrap" class="search-wrap">
        <input id="infSearch" placeholder="인플루언서 검색..." oninput="renderItems()">
      </div>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="item-list" id="itemList"></div>
  </div>

  <div class="right">
    <div class="month-tabs" id="monthTabs"></div>
    <div class="month-body" id="monthBody"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mName"></h3>
    <div class="msub" id="mSub"></div>
    <label>콘텐츠 유형</label>
    <select id="mType" onchange="updateModalPrice()"></select>
    <label>진행 월</label>
    <select id="mMonth"></select>
    <label>메모 (선택)</label>
    <input type="text" id="mMemo" placeholder="메모...">
    <div class="price-box">
      <div class="pb-label">단가 (VAT 별도)</div>
      <div class="pb-main" id="mPriceMain">-</div>
      <div class="pb-vat" id="mPriceVat">VAT 포함: -</div>
    </div>
    <div class="mbtns">
      <button class="mbtn-cancel" onclick="closeModal()">취소</button>
      <button class="mbtn-ok" onclick="addFromModal()">추가 ✓</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['6월','7월','8월','9월','10월','11월','12월'];
const CATS = [
  { id:'inf',   label:'인플루언서', badge:'badge-inf'   },

  { name:'소히조이',       sub:'육아/코미디',     prices:[{t:'브랜디드',v:1000},{t:'릴스',v:300},{t:'숏폼',v:500}] },
  { name:'이개은',         sub:'결혼/브이로그',   prices:[{t:'브랜디드',v:800},{t:'릴스',v:300},{t:'숏폼',v:300}] },
  { name:'미니피',         sub:'관리/제품추천',   prices:[{t:'기획PPL',v:2100},{t:'숏폼',v:700}] },
  { name:'민제',           sub:'뷰티/패션',       prices:[{t:'브랜디드',v:1700},{t:'기획PPL',v:1500},{t:'릴스',v:1100},{t:'숏폼',v:1100}] },

  { name:'최모나',         sub:'뷰티/관리',       prices:[{t:'브랜디드',v:4300},{t:'기획PPL',v:3700},{t:'숏폼',v:1000}] },
  { name:'코코초',         sub:'뷰티',            prices:[{t:'브랜디드',v:3000},{t:'기획PPL',v:2000},{t:'숏폼',v:1000}] },
  { name:'타코사마',       sub:'부부/일상',       prices:[{t:'브랜디드',v:3200},{t:'기획PPL',v:2800},{t:'숏폼',v:800}] },

  { name:'준돌',           sub:'뷰티',            prices:[{t:'브랜디드',v:600},{t:'기획PPL',v:500},{t:'기획PPL+릴스',v:550}] },

const FIXED_ITEMS = {
  amb: [
    { name:'앰버서더', desc:'팔로워 5~20만 / 뷰티 카테고리 외', mode:'per',
      countLabel:'인원(명)', defaultCount:100, unitLabel:'인당 단가(만원)', defaultUnit:30 },
  ],
  exp: [
    { name:'레뷰 프리미어', desc:'방문자 3천+ / 네이버 인플루언서 / 인스타 50k', mode:'per',
      countLabel:'인원(명)', defaultCount:30, unitLabel:'인당 단가(만원)', defaultUnit:5 },
    { name:'레뷰 베이직', desc:'일반 블로그', mode:'per',
      countLabel:'인원(명)', defaultCount:30, unitLabel:'인당 단가(만원)', defaultUnit:1 },
    { name:'서포터즈 인스타', desc:'인스타 채널 서포터즈', mode:'per',

  ],
  ad: [
    { name:'메타 광고', desc:'인스타그램 / 페이스북', mode:'fixed', valLabel:'월 집행금액(만원)', defaultVal:1000 },
    { name:'네이버 SA', desc:'네이버 검색광고', mode:'fixed', valLabel:'월 집행금액(만원)', defaultVal:1200 },
    { name:'네이버 쇼핑광고', desc:'쇼핑 검색광고', mode:'fixed', valLabel:'월 집행금액(만원)', defaultVal:0 },
  ],
  viral: [
    { name:'X(트위터) 바이럴', desc:'전문 대행사 운영', mode:'fixed', valLabel:'월 비용(만원)', defaultVal:100 },
    { name:'쓰레드 바이럴', desc:'전문 대행사 운영', mode:'fixed', valLabel:'월 비용(만원)', defaultVal:100 },
  ],

    { name:'촬영 소품비', desc:'스튜디오 내 기존 소품 우선 활용', mode:'fixed', valLabel:'비용(만원)', defaultVal:10 },
    { name:'기타 제작비', desc:'콘텐츠 외주 등', mode:'fixed', valLabel:'비용(만원)', defaultVal:0 },

let plan = {};
MONTHS.forEach(m => plan[m] = []);
let activeCat = 'inf';
let activeMonth = '6월';
let modalData = null;

const fmt = n => Math.round(n).toLocaleString('ko-KR');
const allTotal = () => Object.values(plan).flat().reduce((s,i) => s + i.priceVat, 0);

function updateHeader() {
  const budget = +document.getElementById('budgetInput').value || 100000;
  const total = allTotal();
  const remain = budget - total;
  const se = document.getElementById('hSpent'), re = document.getElementById('hRemain');
  se.textContent = fmt(total) + '만원';
  se.className = 'hval ' + (total > budget ? 'over' : 'ok');
  re.textContent = fmt(remain) + '만원';
  re.className = 'hval ' + (remain < 0 ? 'over' : 'ok');
}

function renderCatTabs() {
  document.getElementById('catTabs').innerHTML = CATS.map(c =>
    `<div class="cat-tab ${c.id===activeCat?'active':''}" onclick="setCat('${c.id}')">${c.label}</div>`
  ).join('');
  document.getElementById('infSearchWrap').style.display = activeCat === 'inf' ? 'block' : 'none';
}
function setCat(id) { activeCat = id; renderCatTabs(); renderItems(); }

function renderItems() {
  const el = document.getElementById('itemList');
  if (activeCat === 'inf') {
    const q = document.getElementById('infSearch').value.toLowerCase();
    const list = INFLUENCERS.filter(i => i.name.toLowerCase().includes(q) || i.sub.toLowerCase().includes(q));
    el.innerHTML = list.map(inf => `
      <div class="inf-card" onclick="openModal('${inf.name}')">
        <div class="inf-top">
          <span class="inf-name">${inf.name}</span>
          <span class="inf-cat-badge">${inf.sub}</span>
        </div>
        <div class="price-chips">${inf.prices.map(p => `<span class="pchip">${p.t} ${fmt(p.v)}만</span>`).join('')}</div>
      </div>`).join('') || '<div style="padding:24px;text-align:center;color:#bbb">검색 결과 없음</div>';
  } else {
    const items = FIXED_ITEMS[activeCat] || [];
    el.innerHTML = items.map((item, idx) => {
      const catId = activeCat;
      if (item.mode === 'per') {
        return `<div class="fixed-card">
          <h4>${item.name}</h4>
          <div class="fixed-desc">${item.desc}</div>
          <div class="fixed-fields">
            <div class="field-row">
              <label>${item.countLabel}</label>
              <input type="number" class="w60" id="fc_${catId}_${idx}_count" value="${item.defaultCount}" oninput="updateCalc('${catId}',${idx})">
              <span style="font-size:11px;color:#888">명</span>
            </div>
            <div class="field-row">
              <label>${item.unitLabel}</label>
              <input type="number" class="w80" id="fc_${catId}_${idx}_unit" value="${item.defaultUnit}" oninput="updateCalc('${catId}',${idx})">
              <span style="font-size:11px;color:#888">만원</span>
            </div>
            <div class="field-row">
              <label>진행 월</label>
              <select id="fc_${catId}_${idx}_month">${MONTHS.map(m=>`<option ${m===activeMonth?'selected':''}>${m}</option>`).join('')}</select>
            </div>
            <div class="field-row">
              <label>메모</label>
              <input type="text" class="w120" id="fc_${catId}_${idx}_memo" placeholder="메모...">
            </div>
            <div class="field-row">
              <label>합계</label>
              <span class="calc-preview" id="fc_${catId}_${idx}_preview">${fmt(item.defaultCount*item.defaultUnit)}만 → VAT포함 ${fmt(item.defaultCount*item.defaultUnit*1.1)}만</span>
            </div>
          </div>
          <button class="btn-add-fixed" onclick="addFixed('${catId}',${idx})">플랜에 추가 ✓</button>
        </div>`;
      } else {
        return `<div class="fixed-card">
          <h4>${item.name}</h4>
          <div class="fixed-desc">${item.desc}</div>
          <div class="fixed-fields">
            <div class="field-row">
              <label>${item.valLabel}</label>
              <input type="number" class="w80" id="fc_${catId}_${idx}_val" value="${item.defaultVal}" oninput="updateCalcFixed('${catId}',${idx})">
              <span style="font-size:11px;color:#888">만원</span>
            </div>
            <div class="field-row">
              <label>진행 월</label>
              <select id="fc_${catId}_${idx}_month">${MONTHS.map(m=>`<option ${m===activeMonth?'selected':''}>${m}</option>`).join('')}</select>
            </div>
            <div class="field-row">
              <label>메모</label>
              <input type="text" class="w120" id="fc_${catId}_${idx}_memo" placeholder="메모...">
            </div>
            <div class="field-row">
              <label>VAT포함</label>
              <span class="calc-preview" id="fc_${catId}_${idx}_preview">VAT포함 ${fmt(item.defaultVal*1.1)}만</span>
            </div>
          </div>
          <button class="btn-add-fixed" onclick="addFixed('${catId}',${idx})">플랜에 추가 ✓</button>
        </div>`;
      }
    }).join('');
  }
}

function updateCalc(cat, idx) {
  const count = +document.getElementById(`fc_${cat}_${idx}_count`).value || 0;
  const unit  = +document.getElementById(`fc_${cat}_${idx}_unit`).value  || 0;
  const t = count * unit;
  document.getElementById(`fc_${cat}_${idx}_preview`).textContent = `${fmt(t)}만 → VAT포함 ${fmt(t*1.1)}만`;
}
function updateCalcFixed(cat, idx) {
  const v = +document.getElementById(`fc_${cat}_${idx}_val`).value || 0;
  document.getElementById(`fc_${cat}_${idx}_preview`).textContent = `VAT포함 ${fmt(v*1.1)}만`;
}

function addFixed(cat, idx) {
  const item = FIXED_ITEMS[cat][idx];
  const month = document.getElementById(`fc_${cat}_${idx}_month`).value;
  const memo  = document.getElementById(`fc_${cat}_${idx}_memo`).value;
  let price, label;
  if (item.mode === 'per') {
    const count = +document.getElementById(`fc_${cat}_${idx}_count`).value || 0;
    const unit  = +document.getElementById(`fc_${cat}_${idx}_unit`).value  || 0;
    price = count * unit;
    label = `${count}명 × ${unit}만`;
  } else {
    price = +document.getElementById(`fc_${cat}_${idx}_val`).value || 0;
    label = item.name;
  }
  plan[month].push({ id: Date.now(), cat, name: item.name, type: label, price, priceVat: Math.round(price*1.1), memo });
  refresh();
}

function openModal(name) {
  modalData = INFLUENCERS.find(i => i.name === name);
  document.getElementById('mName').textContent = modalData.name;
  document.getElementById('mSub').textContent = modalData.sub;
  document.getElementById('mType').innerHTML = modalData.prices.map(p =>
    `<option value="${p.v}">${p.t} — ${fmt(p.v)}만원</option>`).join('');
  document.getElementById('mMonth').innerHTML = MONTHS.map(m =>
    `<option ${m===activeMonth?'selected':''}>${m}</option>`).join('');
  document.getElementById('mMemo').value = '';
  updateModalPrice();
  document.getElementById('overlay').classList.add('show');
}
function updateModalPrice() {
  const v = +document.getElementById('mType').value;
  document.getElementById('mPriceMain').textContent = fmt(v) + '만원';
  document.getElementById('mPriceVat').textContent = 'VAT 포함: ' + fmt(v*1.1) + '만원';
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }
function addFromModal() {
  const typeEl = document.getElementById('mType');
  const t = typeEl.options[typeEl.selectedIndex].text.split(' — ')[0];
  const v = +typeEl.value;
  const month = document.getElementById('mMonth').value;
  plan[month].push({ id: Date.now(), cat:'inf', name: modalData.name, type: t, price: v, priceVat: Math.round(v*1.1), memo: document.getElementById('mMemo').value });
  closeModal();
  refresh();
}

function renderMonthTabs() {
  document.getElementById('monthTabs').innerHTML = MONTHS.map(m => {
    const t = plan[m].reduce((s,i) => s + i.priceVat, 0);
    return `<div class="mtab ${m===activeMonth?'active':''}" onclick="setMonth('${m}')">
      ${m}${t > 0 ? `<span class="mbadge">${fmt(t)}</span>` : ''}
    </div>`;
  }).join('');
}
function setMonth(m) { activeMonth = m; renderMonthTabs(); renderMonthBody(); }

function renderMonthBody() {
  const items = plan[activeMonth];
  const budget = +document.getElementById('budgetInput').value || 100000;
  const monthVat = items.reduce((s,i) => s + i.priceVat, 0);
  const monthRaw = items.reduce((s,i) => s + i.price, 0);
  const cumTotal = allTotal();

  let html = `
  <div class="summary-grid">
    <div class="scard"><div class="slabel">${activeMonth} VAT 별도</div><div class="sval">${fmt(monthRaw)}만</div></div>
    <div class="scard"><div class="slabel">${activeMonth} VAT 포함</div><div class="sval">${fmt(monthVat)}만</div></div>
    <div class="scard"><div class="slabel">전체 누적 (VAT포함)</div><div class="sval ${cumTotal>budget?'over':''}">${fmt(cumTotal)}만</div></div>
    <div class="scard"><div class="slabel">잔여 예산</div><div class="sval ${budget-cumTotal<0?'over':''}">${fmt(budget-cumTotal)}만</div></div>
  </div>`;

  CATS.forEach(cat => {
    const catItems = items.filter(i => i.cat === cat.id);
    const catVat = catItems.reduce((s,i) => s + i.priceVat, 0);
    const catRaw = catItems.reduce((s,i) => s + i.price, 0);
    html += `
    <div class="plan-section">
      <div class="plan-section-head">
        <h3><span class="type-badge ${cat.badge}">${cat.label}</span></h3>
        <span class="section-total">${catVat > 0 ? fmt(catVat)+'만원 (VAT포함)' : '–'}</span>
      </div>`;
    if (catItems.length === 0) {
      html += `<div class="empty-msg">← 왼쪽 [${cat.label}] 탭에서 추가</div>`;
    } else {
      html += `<table><thead><tr>
        <th>이름</th><th>유형 / 내용</th>
        <th style="text-align:right">VAT별도</th>
        <th style="text-align:right">VAT포함</th>
        <th>메모</th><th></th>
      </tr></thead><tbody>`;
      catItems.forEach(i => {
        html += `<tr>
          <td style="font-weight:600">${i.name}</td>
          <td><span class="type-badge ${cat.badge}">${i.type}</span></td>
          <td style="text-align:right">${fmt(i.price)}만</td>
          <td style="text-align:right;font-weight:600">${fmt(i.priceVat)}만</td>
          <td><input class="memo-inp" value="${i.memo}" placeholder="메모..." onchange="updateMemo('${activeMonth}',${i.id},this.value)"></td>
          <td><button class="del-btn" onclick="delItem('${activeMonth}',${i.id})">✕</button></td>
        </tr>`;
      });
      html += `<tr class="trow-total"><td colspan="2">소계</td>
        <td style="text-align:right">${fmt(catRaw)}만</td>
        <td style="text-align:right">${fmt(catVat)}만</td>
        <td colspan="2"></td></tr>`;
      html += `</tbody></table>`;
    }
    html += `</div>`;
  });

  document.getElementById('monthBody').innerHTML = html;
}

function delItem(month, id) {
  plan[month] = plan[month].filter(i => i.id !== id);
  refresh();
}
function updateMemo(month, id, val) {
  const item = plan[month].find(i => i.id === id);
  if (item) item.memo = val;
}
function refresh() { renderMonthTabs(); renderMonthBody(); updateHeader(); }

document.getElementById('budgetInput').addEventListener('input', refresh);
document.getElementById('overlay').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });

renderCatTabs(); renderItems(); renderMonthTabs(); renderMonthBody(); updateHeader();
</script>
</body>
</html>
