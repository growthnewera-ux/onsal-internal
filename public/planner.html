<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온살 인플루언서 예산 플래너</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f5f7; color: #1d1d1f; }

  header { background: #1d1d1f; color: white; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 600; }
  .budget-bar { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .budget-item { text-align: right; }
  .budget-item label { font-size: 11px; color: #aaa; display: block; }
  .budget-item span { font-size: 18px; font-weight: 700; }
  .budget-item span.over { color: #ff4d4d; }
  .budget-item span.ok { color: #34c759; }

  .container { display: grid; grid-template-columns: 400px 1fr; height: calc(100vh - 72px); }

  /* LEFT PANEL */
  .left-panel { background: white; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 16px 20px; border-bottom: 1px solid #e5e5e5; }
  .panel-header h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .search-box { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
  .search-box:focus { border-color: #007aff; }
  .filter-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 4px 10px; border: 1px solid #ddd; border-radius: 20px; font-size: 11px; cursor: pointer; background: white; transition: all 0.15s; }
  .filter-btn.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }

  .influencer-list { overflow-y: auto; flex: 1; }
  .influencer-card { padding: 12px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  .influencer-card:hover { background: #f5f5f7; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .card-name { font-size: 14px; font-weight: 600; }
  .card-category { font-size: 11px; color: #888; background: #f0f0f0; padding: 2px 7px; border-radius: 10px; }
  .price-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .price-chip { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid #e0e0e0; background: white; white-space: nowrap; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 28px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12px; color: #888; margin-bottom: 20px; }
  .modal label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; color: #555; }
  .modal select, .modal input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 14px; outline: none; }
  .modal select:focus, .modal input[type=text]:focus { border-color: #007aff; }
  .modal-price-display { background: #f5f5f7; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center; }
  .modal-price-display .price-vat { font-size: 11px; color: #888; }
  .modal-price-display .price-main { font-size: 22px; font-weight: 700; color: #1d1d1f; }
  .modal-price-display .price-vat-inc { font-size: 12px; color: #888; margin-top: 2px; }
  .modal-btns { display: flex; gap: 8px; }
  .btn-cancel { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 13px; cursor: pointer; }
  .btn-add { flex: 2; padding: 11px; border: none; border-radius: 8px; background: #007aff; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-add:hover { background: #0066dd; }

  /* RIGHT PANEL */
  .right-panel { display: flex; flex-direction: column; overflow: hidden; }
  .month-tabs { display: flex; background: white; border-bottom: 1px solid #e5e5e5; padding: 0 20px; overflow-x: auto; flex-shrink: 0; }
  .month-tab { padding: 14px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; color: #888; transition: all 0.15s; }
  .month-tab.active { color: #007aff; border-bottom-color: #007aff; font-weight: 600; }
  .month-content { flex: 1; overflow-y: auto; padding: 20px; }

  .month-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .summary-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #e5e5e5; }
  .summary-card .s-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .summary-card .s-value { font-size: 20px; font-weight: 700; }
  .summary-card .s-value.over { color: #ff4d4d; }

  .plan-table-wrap { background: white; border-radius: 12px; border: 1px solid #e5e5e5; overflow: hidden; }
  .plan-table-header { padding: 14px 20px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
  .plan-table-header h3 { font-size: 14px; font-weight: 600; }
  .empty-state { padding: 48px; text-align: center; color: #aaa; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; color: #888; background: #f9f9f9; border-bottom: 1px solid #e5e5e5; }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .delete-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: all 0.1s; }
  .delete-btn:hover { color: #ff4d4d; background: #fff0f0; }
  .content-type-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f0fe; color: #1a73e8; display: inline-block; }
  .memo-input { border: none; background: transparent; font-size: 12px; color: #888; width: 120px; outline: none; }
  .memo-input:focus { background: #f5f5f7; border-radius: 4px; padding: 2px 4px; }
  .total-row td { font-weight: 700; background: #f9f9f9; border-top: 2px solid #e5e5e5; }
</style>
</head>
<body>

<header>
  <h1>🌿 온살 인플루언서 예산 플래너</h1>
  <div class="budget-bar">
    <div class="budget-item">
      <label>총 예산 (만원)</label>
      <span>
        <input id="totalBudgetInput" type="number" value="100000"
          style="background:transparent;border:none;border-bottom:1px solid #555;color:white;font-size:18px;font-weight:700;width:90px;text-align:right;outline:none;">만원
      </span>
    </div>
    <div class="budget-item">
      <label>집행 합계 (VAT포함)</label>
      <span id="totalSpent" class="ok">0만원</span>
    </div>
    <div class="budget-item">
      <label>잔여 예산</label>
      <span id="totalRemain" class="ok">100,000만원</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="left-panel">
    <div class="panel-header">
      <h2>인플루언서 목록 <span style="color:#888;font-weight:400;font-size:12px">— 클릭해서 플랜에 추가</span></h2>
      <input class="search-box" id="searchInput" placeholder="이름 또는 카테고리 검색..." oninput="renderList()">
      <div class="filter-row" id="filterRow"></div>
    </div>
    <div class="influencer-list" id="influencerList"></div>
  </div>

  <div class="right-panel">
    <div class="month-tabs" id="monthTabs"></div>
    <div class="month-content" id="monthContent"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalName"></h3>
    <div class="modal-sub" id="modalSub"></div>
    <label>콘텐츠 유형</label>
    <select id="modalType" onchange="updateModalPrice()"></select>
    <label>진행 월</label>
    <select id="modalMonth"></select>
    <label>메모 (선택)</label>
    <input type="text" id="modalMemo" placeholder="예: 8월 24일 주차 확정">
    <div class="modal-price-display">
      <div class="price-vat">단가 (VAT 별도)</div>
      <div class="price-main" id="modalPriceMain">-</div>
      <div class="price-vat-inc" id="modalPriceVat">VAT 포함: -</div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-add" onclick="addToPlan()">플랜에 추가 ✓</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['6월','7월','8월','9월','10월','11월','12월'];
const CATEGORIES = ['전체','뷰티','일상/브이로그','아이돌','부부/육아','라이프스타일','연예인','뮤직'];

const INFLUENCERS = [
  { name:'이리유', cat:'뷰티', prices:[{type:'브랜디드',v:4300},{type:'기획PPL',v:3300},{type:'릴스',v:600},{type:'쇼츠',v:800}] },
  { name:'시네', cat:'뷰티', prices:[{type:'브랜디드',v:4000},{type:'숏폼(3채널)',v:3200}] },
  { name:'슥슥팡팡(BDC)', cat:'아이돌', prices:[{type:'BDC 브랜디드',v:4000},{type:'믿뷰 브랜디드',v:2500},{type:'BB(삐삐) 브랜디드',v:2500},{type:'도믿걸 월스폰(4회)',v:1000},{type:'도믿걸 1회',v:400}] },
  { name:'종지부부', cat:'부부/육아', prices:[{type:'브랜디드',v:1200},{type:'릴스',v:600},{type:'숏폼',v:600}] },
  { name:'소히조이', cat:'부부/육아', prices:[{type:'브랜디드',v:1000},{type:'릴스',v:300},{type:'숏폼',v:500}] },
  { name:'이개은', cat:'일상/브이로그', prices:[{type:'브랜디드',v:800},{type:'릴스',v:300},{type:'숏폼',v:300}] },
  { name:'미니피', cat:'라이프스타일', prices:[{type:'기획PPL',v:2100},{type:'숏폼',v:700}] },
  { name:'민제', cat:'뷰티', prices:[{type:'브랜디드',v:1700},{type:'기획PPL',v:1500},{type:'릴스',v:1100},{type:'숏폼',v:1100}] },
  { name:'채인', cat:'아이돌', prices:[{type:'브랜디드',v:200},{type:'기획PPL',v:100}] },
  { name:'이밍꾸', cat:'일상/브이로그', prices:[{type:'브랜디드',v:400},{type:'기획PPL',v:250}] },
  { name:'뀨우', cat:'일상/브이로그', prices:[{type:'브랜디드',v:850},{type:'기획PPL',v:750}] },
  { name:'김소원', cat:'아이돌', prices:[{type:'브랜디드',v:2000},{type:'기획PPL',v:1500}] },
  { name:'규진', cat:'일상/브이로그', prices:[{type:'브랜디드',v:3000},{type:'기획PPL',v:2400}] },
  { name:'어쩔수없는윤화', cat:'라이프스타일', prices:[{type:'기획PPL',v:2000},{type:'숏폼',v:800}] },
  { name:'명예영국인', cat:'라이프스타일', prices:[{type:'기획PPL',v:4000},{type:'숏폼',v:3000}] },
  { name:'류타쿠', cat:'부부/육아', prices:[{type:'브랜디드',v:800},{type:'기획PPL',v:600},{type:'숏폼',v:500}] },
  { name:'병권', cat:'라이프스타일', prices:[{type:'브랜디드',v:500},{type:'숏폼',v:250}] },
  { name:'리비', cat:'라이프스타일', prices:[{type:'브랜디드',v:1000},{type:'기획PPL',v:800},{type:'숏폼',v:400}] },
  { name:'보리', cat:'뷰티', prices:[{type:'기획PPL',v:700},{type:'숏폼',v:500}] },
  { name:'배지현', cat:'일상/브이로그', prices:[{type:'브랜디드',v:3000},{type:'기획PPL',v:2000}] },
  { name:'최모나', cat:'뷰티', prices:[{type:'브랜디드',v:4300},{type:'기획PPL',v:3700},{type:'숏폼',v:1000}] },
  { name:'코코초', cat:'뷰티', prices:[{type:'브랜디드',v:3000},{type:'기획PPL',v:2000},{type:'숏폼',v:1000}] },
  { name:'타코사마', cat:'부부/육아', prices:[{type:'브랜디드',v:3200},{type:'기획PPL',v:2800},{type:'숏폼',v:800}] },
  { name:'지혜사랑', cat:'일상/브이로그', prices:[{type:'브랜디드',v:920},{type:'기획PPL',v:770},{type:'숏폼',v:390}] },
  { name:'권응비', cat:'아이돌', prices:[{type:'브랜디드',v:3300},{type:'기획PPL',v:2200}] },
  { name:'내사랑 류이서', cat:'일상/브이로그', prices:[{type:'브랜디드',v:2500},{type:'기획PPL',v:1500},{type:'초상라이선스',v:1000},{type:'온라인광고',v:2000},{type:'커머스라이선스',v:2000}] },
  { name:'들어봐!유리의숲', cat:'뮤직', prices:[{type:'브랜디드',v:5000},{type:'기획PPL',v:3000}] },
  { name:'조조캠핑', cat:'라이프스타일', prices:[{type:'브랜디드',v:2000},{type:'기획PPL',v:1400}] },
  { name:'천상여자김지유', cat:'연예인', prices:[{type:'기획PPL',v:3000},{type:'인스타릴스',v:1500},{type:'인스타피드',v:1200}] },
  { name:'차예련', cat:'연예인', prices:[{type:'브랜디드',v:4500},{type:'기획PPL',v:3500},{type:'2차활용(1개월)',v:2000}] },
  { name:'유인영', cat:'연예인', prices:[{type:'브랜디드',v:2500},{type:'기획PPL',v:1500},{type:'2차활용',v:2000},{type:'2차활용패키지',v:4000}] },
  { name:'함은정', cat:'연예인', prices:[{type:'브랜디드',v:2500},{type:'기획PPL',v:1500},{type:'2차활용',v:2000},{type:'2차활용패키지',v:4000}] },
  { name:'준돌', cat:'뷰티', prices:[{type:'브랜디드',v:600},{type:'기획PPL',v:500},{type:'기획PPL+릴스',v:550}] },
];

let plan = {};
let activeMonth = '6월';
let activeFilter = '전체';
let modalData = null;

MONTHS.forEach(m => plan[m] = []);

function fmt(n) { return n.toLocaleString('ko-KR'); }

function renderFilters() {
  document.getElementById('filterRow').innerHTML = CATEGORIES.map(c =>
    `<button class="filter-btn ${c===activeFilter?'active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}
function setFilter(f) { activeFilter = f; renderFilters(); renderList(); }

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = INFLUENCERS.filter(inf => {
    const matchQ = inf.name.toLowerCase().includes(q) || inf.cat.toLowerCase().includes(q);
    const matchF = activeFilter === '전체' || inf.cat === activeFilter;
    return matchQ && matchF;
  });
  document.getElementById('influencerList').innerHTML = filtered.map(inf => `
    <div class="influencer-card" onclick="openModal('${inf.name}')">
      <div class="card-top">
        <span class="card-name">${inf.name}</span>
        <span class="card-category">${inf.cat}</span>
      </div>
      <div class="price-chips">
        ${inf.prices.map(p => `<span class="price-chip">${p.type} ${fmt(p.v)}만</span>`).join('')}
      </div>
    </div>
  `).join('') || '<div style="padding:32px;text-align:center;color:#aaa">검색 결과 없음</div>';
}

function openModal(name) {
  modalData = INFLUENCERS.find(i => i.name === name);
  document.getElementById('modalName').textContent = modalData.name;
  document.getElementById('modalSub').textContent = modalData.cat;
  document.getElementById('modalType').innerHTML = modalData.prices.map(p =>
    `<option value="${p.v}">${p.type} — ${fmt(p.v)}만원</option>`
  ).join('');
  document.getElementById('modalMonth').innerHTML = MONTHS.map(m =>
    `<option value="${m}" ${m===activeMonth?'selected':''}>${m}</option>`
  ).join('');
  document.getElementById('modalMemo').value = '';
  updateModalPrice();
  document.getElementById('modalOverlay').classList.add('show');
}
function updateModalPrice() {
  const v = parseInt(document.getElementById('modalType').value);
  document.getElementById('modalPriceMain').textContent = fmt(v) + '만원';
  document.getElementById('modalPriceVat').textContent = 'VAT 포함: ' + fmt(Math.round(v*1.1)) + '만원';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

function addToPlan() {
  const typeEl = document.getElementById('modalType');
  const selectedType = typeEl.options[typeEl.selectedIndex].text.split(' — ')[0];
  const price = parseInt(typeEl.value);
  const month = document.getElementById('modalMonth').value;
  plan[month].push({
    id: Date.now(),
    name: modalData.name,
    cat: modalData.cat,
    type: selectedType,
    price,
    priceVat: Math.round(price * 1.1),
    memo: document.getElementById('modalMemo').value
  });
  closeModal();
  renderMonthTabs();
  renderMonthContent();
  updateHeader();
}

function deleteItem(month, id) {
  plan[month] = plan[month].filter(i => i.id !== id);
  renderMonthTabs();
  renderMonthContent();
  updateHeader();
}

function renderMonthTabs() {
  document.getElementById('monthTabs').innerHTML = MONTHS.map(m => {
    const total = plan[m].reduce((s,i) => s + i.priceVat, 0);
    const badge = total > 0 ? ` <span style="font-size:10px;background:#007aff;color:white;border-radius:10px;padding:1px 6px;margin-left:4px">${fmt(total)}</span>` : '';
    return `<div class="month-tab ${m===activeMonth?'active':''}" onclick="setMonth('${m}')">${m}${badge}</div>`;
  }).join('');
}
function setMonth(m) { activeMonth = m; renderMonthTabs(); renderMonthContent(); }

function renderMonthContent() {
  const items = plan[activeMonth];
  const totalVat = items.reduce((s,i) => s + i.priceVat, 0);
  const totalRaw = items.reduce((s,i) => s + i.price, 0);
  const budget = parseInt(document.getElementById('totalBudgetInput').value) || 100000;
  const allTotal = Object.values(plan).flat().reduce((s,i) => s + i.priceVat, 0);

  document.getElementById('monthContent').innerHTML = `
    <div class="month-summary">
      <div class="summary-card">
        <div class="s-label">${activeMonth} 집행액 (VAT 별도)</div>
        <div class="s-value">${fmt(totalRaw)}만</div>
      </div>
      <div class="summary-card">
        <div class="s-label">${activeMonth} 집행액 (VAT 포함)</div>
        <div class="s-value">${fmt(totalVat)}만</div>
      </div>
      <div class="summary-card">
        <div class="s-label">전체 누적 (VAT 포함)</div>
        <div class="s-value ${allTotal > budget ? 'over' : ''}">${fmt(allTotal)}만</div>
      </div>
    </div>
    <div class="plan-table-wrap">
      <div class="plan-table-header">
        <h3>${activeMonth} 플랜 <span style="color:#888;font-weight:400;font-size:12px">${items.length}건</span></h3>
      </div>
      ${items.length === 0
        ? '<div class="empty-state">← 왼쪽에서 인플루언서를 클릭해 추가하세요</div>'
        : `<table>
            <thead><tr>
              <th>이름</th><th>카테고리</th><th>콘텐츠 유형</th>
              <th style="text-align:right">단가 (VAT별도)</th>
              <th style="text-align:right">단가 (VAT포함)</th>
              <th>메모</th><th></th>
            </tr></thead>
            <tbody>
              ${items.map(i => `
                <tr>
                  <td style="font-weight:600">${i.name}</td>
                  <td><span style="font-size:11px;color:#888">${i.cat}</span></td>
                  <td><span class="content-type-badge">${i.type}</span></td>
                  <td style="text-align:right">${fmt(i.price)}만</td>
                  <td style="text-align:right;font-weight:600">${fmt(i.priceVat)}만</td>
                  <td><input class="memo-input" value="${i.memo}" placeholder="메모..." onchange="updateMemo('${activeMonth}',${i.id},this.value)"></td>
                  <td><button class="delete-btn" onclick="deleteItem('${activeMonth}',${i.id})">✕</button></td>
                </tr>
              `).join('')}
              <tr class="total-row">
                <td colspan="3">합계</td>
                <td style="text-align:right">${fmt(totalRaw)}만원</td>
                <td style="text-align:right">${fmt(totalVat)}만원</td>
                <td colspan="2"></td>
              </tr>
            </tbody>
          </table>`
      }
    </div>
  `;
}

function updateMemo(month, id, val) {
  const item = plan[month].find(i => i.id === id);
  if (item) item.memo = val;
}

function updateHeader() {
  const budget = parseInt(document.getElementById('totalBudgetInput').value) || 100000;
  const allTotal = Object.values(plan).flat().reduce((s,i) => s + i.priceVat, 0);
  const remain = budget - allTotal;
  const spentEl = document.getElementById('totalSpent');
  const remainEl = document.getElementById('totalRemain');
  spentEl.textContent = fmt(allTotal) + '만원';
  spentEl.className = allTotal > budget ? 'over' : 'ok';
  remainEl.textContent = fmt(remain) + '만원';
  remainEl.className = remain < 0 ? 'over' : 'ok';
}

document.getElementById('totalBudgetInput').addEventListener('input', () => { updateHeader(); renderMonthContent(); });
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

renderFilters(); renderList(); renderMonthTabs(); renderMonthContent(); updateHeader();
</script>
</body>
</html>
