<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온살 예산 플래너</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
:root {
  --bg:#f4f5f7; --white:#fff; --border:#e2e4e9; --border2:#d0d3db;
  --text:#111318; --text2:#4a4f5e; --text3:#9098ae;
  --accent:#5b4ef8; --accent-bg:#ede9ff;
  --green:#12a05c; --green-bg:#e6f7ef;
  --red:#e03131; --red-bg:#fff0f0;
  --orange:#d9600a;
  --inf:#2563eb; --inf-bg:#eff6ff;
  --amb:#c2410c; --amb-bg:#fff7ed;
  --exp:#15803d; --exp-bg:#f0fdf4;
  --ad:#7c3aed;  --ad-bg:#f5f3ff;
  --viral:#be185d; --viral-bg:#fdf2f8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ── HEADER ── */
.app-header {
  height:56px; background:var(--white); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:0;
  box-shadow:0 1px 4px rgba(0,0,0,.05); position:sticky; top:0; z-index:50; flex-shrink:0;
}
.logo {
  display:flex; align-items:center; gap:8px;
  font-size:15px; font-weight:800; color:var(--text);
  padding-right:16px; border-right:1px solid var(--border); white-space:nowrap;
}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.gnav-link{padding:0 14px;height:56px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--text3);text-decoration:none;border-bottom:3px solid transparent;transition:all .15s;}
.gnav-link:hover{color:var(--text2);}
.gnav-link.active{color:var(--accent);border-bottom-color:var(--accent);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:0;border-left:1px solid var(--border);}
.hstat{padding:0 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;}
.hstat-label{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px;}
.hstat-val{font-size:14px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
.hstat-val.ok{color:var(--green);}
.hstat-val.over{color:var(--red);}
.hstat-val.neu{color:var(--text);}
.budget-input{background:transparent;border:none;border-bottom:2px solid var(--accent);color:var(--text);font-size:14px;font-weight:800;width:80px;text-align:right;outline:none;font-family:inherit;letter-spacing:-.4px;}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 56px);}

/* ── LEFT PANEL ── */
.left{background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.left-top{padding:14px 14px 0;flex-shrink:0;}
.left-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}

/* search */
.search-wrap{position:relative;margin-bottom:0;}
.search-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;font-size:13px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s;}
.search-input::placeholder{color:var(--text3);}
.search-input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;}

/* cat tabs */
.cat-tabs{display:flex;padding:10px 14px 0;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.cat-tab{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text3);background:var(--bg);transition:all .12s;white-space:nowrap;margin-bottom:3px;}
.cat-tab:hover{border-color:var(--border2);color:var(--text);}
.cat-tab.a-inf  {background:var(--inf-bg);  border-color:var(--inf);  color:var(--inf);}
.cat-tab.a-amb  {background:var(--amb-bg);  border-color:var(--amb);  color:var(--amb);}
.cat-tab.a-exp  {background:var(--exp-bg);  border-color:var(--exp);  color:var(--exp);}
.cat-tab.a-ad   {background:var(--ad-bg);   border-color:var(--ad);   color:var(--ad);}
.cat-tab.a-viral{background:var(--viral-bg);border-color:var(--viral);color:var(--viral);}

/* sub-filter chips */
.sub-filter{display:flex;padding:8px 14px 0;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.sf-chip{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--text3);background:transparent;transition:all .12s;white-space:nowrap;}
.sf-chip:hover{color:var(--text2);border-color:var(--border2);}
.sf-chip.on{background:var(--text);border-color:var(--text);color:white;}

/* yt load button */
.yt-btn-wrap{padding:8px 14px 0;flex-shrink:0;}
.yt-btn{width:100%;padding:7px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit;transition:all .15s;}
.yt-btn:hover{background:var(--accent-bg);border-color:var(--accent);}

.item-list{overflow-y:auto;flex:1;padding:6px 0 12px;}

/* ── PPL COMPACT 2-COL GRID ── */
.inf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px;}
.inf-card{background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:10px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:7px;}
.inf-card:hover{background:var(--white);border-color:var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.ic-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;}
.ic-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;}
.ic-cat{font-size:9px;color:var(--text3);background:var(--white);padding:2px 5px;border-radius:5px;border:1px solid var(--border);font-weight:600;flex-shrink:0;white-space:nowrap;}
.ic-meta{display:flex;justify-content:space-between;align-items:center;}
.ic-subs{font-size:10px;color:var(--text3);font-weight:500;}
.ic-avg{font-size:10px;color:var(--text3);font-weight:500;}
.ic-prices{display:flex;flex-direction:column;gap:3px;}
.ic-price-row{display:flex;justify-content:space-between;align-items:center;}
.ic-ptype{font-size:10px;color:var(--text3);}
.ic-pval{font-size:12px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.ic-footer{display:flex;gap:4px;margin-top:1px;}
.ic-ch-btn{font-size:10px;font-weight:700;color:var(--accent);text-decoration:none;padding:3px 7px;background:var(--accent-bg);border-radius:5px;white-space:nowrap;}
.ic-ch-btn:hover{text-decoration:none;opacity:.85;}
.ic-add-btn{flex:1;font-size:11px;font-weight:700;background:var(--accent);color:white;border:none;border-radius:5px;padding:4px;cursor:pointer;font-family:inherit;transition:all .12s;}
.ic-add-btn:hover{background:#4a3de0;}
.ic-note{font-size:10px;color:var(--text3);background:rgba(0,0,0,.04);padding:4px 6px;border-radius:5px;line-height:1.3;}

/* ── FIXED ITEM LIST ── */
.fixed-list{padding:6px 10px;display:flex;flex-direction:column;gap:4px;}
.fixed-group-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:8px 4px 4px;}
.fli{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:9px;border:1.5px solid transparent;cursor:pointer;transition:all .15s;}
.fli:hover{background:var(--white);border-color:var(--border);box-shadow:0 2px 6px rgba(0,0,0,.05);}
.fli-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.fli-body{flex:1;min-width:0;}
.fli-name{font-size:13px;font-weight:700;color:var(--text);}
.fli-desc{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fli-price{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums;}
.fli-price-sub{font-size:10px;color:var(--text3);}
.fli-add{background:var(--accent);color:white;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}

/* ── RIGHT PANEL ── */
.right{display:flex;flex-direction:column;overflow:hidden;}

/* month tabs */
.month-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;flex-shrink:0;}
.m-tab{padding:14px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--text3);transition:all .15s;display:flex;align-items:center;gap:6px;}
.m-tab:hover{color:var(--text2);}
.m-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.m-badge{font-size:10px;font-weight:700;background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:1px 6px;font-variant-numeric:tabular-nums;}

.right-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}

/* ── SUMMARY ROW ── */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.sum-card{background:var(--white);border-radius:11px;padding:14px 16px;border:1.5px solid var(--border);}
.sum-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.06);}
.sum-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.sum-val{font-size:18px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.sum-val.ok{color:var(--green);}
.sum-val.over{color:var(--red);}
.sum-val.neu{color:var(--text);}
.sum-sub{font-size:11px;color:var(--text3);margin-top:3px;font-variant-numeric:tabular-nums;}
.prog-track{height:5px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;border-radius:5px;transition:width .4s ease;}

/* ── PLAN SECTION ── */
.plan-section{background:var(--white);border-radius:12px;border:1.5px solid var(--border);overflow:hidden;}
.ps-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ps-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ps-name{font-size:14px;font-weight:700;color:var(--text);}
.ps-count{font-size:11px;color:var(--text3);font-weight:500;}
.ps-bar-wrap{flex:1;min-width:60px;}
.ps-bar-track{height:5px;background:var(--bg);border-radius:5px;overflow:hidden;}
.ps-bar-fill{height:100%;border-radius:5px;transition:width .4s;}
.ps-budget-area{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ps-spent{font-size:12px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.ps-pct{font-size:11px;font-weight:800;white-space:nowrap;}
.ps-pct.ok{color:var(--green);}
.ps-pct.warn{color:var(--orange);}
.ps-pct.over{color:var(--red);}
.ps-budget-input{background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--text);width:76px;outline:none;font-family:inherit;font-variant-numeric:tabular-nums;text-align:right;}
.ps-budget-input:focus{border-color:var(--accent);}
.ps-budget-unit{font-size:11px;color:var(--text3);}

/* plan items */
.ps-items{padding:4px 8px 8px;}
.ps-empty{padding:24px;text-align:center;color:var(--text3);font-size:12px;}
.plan-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;transition:background .1s;}
.plan-item:hover{background:var(--bg);}
.pi-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pi-info{flex:1;min-width:0;}
.pi-name{font-size:13px;font-weight:700;color:var(--text);}
.pi-type{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;margin-top:2px;}
.pi-prices{text-align:right;flex-shrink:0;}
.pi-vat{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.pi-raw{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums;}
.pi-memo{background:transparent;border:none;font-size:12px;color:var(--text3);width:100px;outline:none;font-family:inherit;}
.pi-memo:focus{color:var(--text2);}
.pi-del{background:none;border:none;color:var(--border2);cursor:pointer;padding:4px;border-radius:5px;font-size:13px;transition:all .12s;}
.pi-del:hover{color:var(--red);background:var(--red-bg);}

/* section subtotal */
.ps-subtotal{padding:8px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);background:#fafbfc;}
.ps-subtotal-label{font-size:11px;font-weight:600;color:var(--text3);}
.ps-subtotal-val{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.ps-subtotal-sub{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;}

/* pill colors */
.pill-inf  {background:var(--inf-bg);  color:var(--inf);}
.pill-amb  {background:var(--amb-bg);  color:var(--amb);}
.pill-exp  {background:var(--exp-bg);  color:var(--exp);}
.pill-ad   {background:var(--ad-bg);   color:var(--ad);}
.pill-viral{background:var(--viral-bg);color:var(--viral);}

/* dot colors */
.dot-inf  {background:var(--inf);}
.dot-amb  {background:var(--amb);}
.dot-exp  {background:var(--exp);}
.dot-ad   {background:var(--ad);}
.dot-viral{background:var(--viral);}

/* ── MODAL (PPL add) ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(5px);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:var(--white);border-radius:16px;padding:26px;width:380px;border:1.5px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.14);}
.m-name{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.4px;margin-bottom:2px;}
.m-sub{font-size:12px;color:var(--text3);margin-bottom:18px;}
.m-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.m-select,.m-text{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500;color:var(--text);outline:none;font-family:inherit;margin-bottom:13px;}
.m-select:focus,.m-text:focus{border-color:var(--accent);}
.price-box{background:var(--accent-bg);border:1.5px solid rgba(91,78,248,.2);border-radius:10px;padding:14px;margin-bottom:16px;}
.pb-label{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.pb-row{display:flex;justify-content:space-between;align-items:baseline;}
.pb-won{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.6px;font-variant-numeric:tabular-nums;}
.pb-kor{font-size:13px;font-weight:700;color:var(--text3);font-variant-numeric:tabular-nums;}
.pb-div{border:none;border-top:1px solid rgba(91,78,248,.15);margin:8px 0;}
.pb-vat-row{display:flex;justify-content:space-between;}
.pb-vat-label{font-size:11px;color:var(--text3);}
.pb-vat-val{font-size:14px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
.m-btns{display:flex;gap:8px;}
.m-cancel{flex:1;padding:11px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.m-ok{flex:2;padding:11px;background:var(--accent);border:none;border-radius:8px;color:white;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.m-ok:hover{background:#4a3de0;}

/* ── FIXED QUICK-ADD MODAL ── */
.fmodal{width:340px;}
.fm-field-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.fm-fl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.fm-input,.fm-select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;font-size:14px;font-weight:600;color:var(--text);outline:none;font-family:inherit;font-variant-numeric:tabular-nums;}
.fm-input:focus,.fm-select:focus{border-color:var(--accent);}
.fm-preview{background:var(--accent-bg);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.fm-preview-label{font-size:11px;color:var(--accent);font-weight:700;}
.fm-preview-val{font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo"><div class="logo-mark">🌿</div>온살</div>
  <nav id="globalNav"></nav>
  <div class="header-right">
    <div class="hstat">
      <div class="hstat-label">총 예산</div>
      <div class="hstat-val neu"><input class="budget-input" id="budgetInput" type="number" value="10000">만원</div>
    </div>
    <div class="hstat">
      <div class="hstat-label">집행 (VAT포함)</div>
      <div class="hstat-val ok" id="hSpent">0원</div>
    </div>
    <div class="hstat">
      <div class="hstat-label">잔여</div>
      <div class="hstat-val ok" id="hRemain">1억원</div>
    </div>
  </div>
</header>

<div class="layout">

  <!-- LEFT -->
  <div class="left">
    <div class="left-top">
      <div class="left-title">항목 추가</div>
      <div class="search-wrap" id="searchWrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="infSearch" placeholder="인플루언서 검색..." oninput="renderItems()">
      </div>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="sub-filter" id="subFilter"></div>
    <div class="yt-btn-wrap" id="ytBtnWrap">
      <button class="yt-btn" id="ytLoadBtn" onclick="loadAllYtData()">↺ 구독자 · 조회수 불러오기</button>
    </div>
    <div class="item-list" id="itemList"></div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="month-tabs" id="monthTabs"></div>
    <div class="right-body" id="rightBody"></div>
  </div>

</div>

<!-- PPL add modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-name" id="mName"></div>
    <div class="m-sub" id="mSub"></div>
    <label class="m-label">콘텐츠 유형</label>
    <select class="m-select" id="mType" onchange="updateModalPrice()"></select>
    <label class="m-label">진행 월</label>
    <select class="m-select" id="mMonth"></select>
    <label class="m-label">메모 (선택)</label>
    <input class="m-text" id="mMemo" placeholder="예: 8월 24일 주차 확정">
    <div class="price-box">
      <div class="pb-label">단가</div>
      <div class="pb-row"><div class="pb-won" id="pbWon">-</div><div class="pb-kor" id="pbKor">-</div></div>
      <hr class="pb-div">
      <div class="pb-vat-row"><span class="pb-vat-label">VAT 포함</span><span class="pb-vat-val" id="pbVat">-</span></div>
    </div>
    <div class="m-btns">
      <button class="m-cancel" onclick="closeModal()">취소</button>
      <button class="m-ok" onclick="addFromModal()">플랜에 추가 →</button>
    </div>
  </div>
</div>

<!-- Fixed item quick-add modal -->
<div class="overlay" id="foverlay">
  <div class="modal fmodal">
    <div class="m-name" id="fmName"></div>
    <div class="m-sub" id="fmDesc" style="margin-bottom:16px"></div>
    <div id="fmFields"></div>

// ── YOUTUBE DATA ──────────────────────────────────────
const YT_KEY = 'yt_cache_v1';
let ytCache = {};
let ytLoading = {};

function loadYtCache() {
  try {
    const raw = localStorage.getItem(YT_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const cutoff = Date.now() - 12*60*60*1000;
      Object.keys(p).forEach(h => { if (new Date(p[h].updatedAt).getTime() > cutoff) ytCache[h] = p[h]; });
    }
  } catch {}
}
function saveYtCache() { try { localStorage.setItem(YT_KEY, JSON.stringify(ytCache)); } catch {} }

async function fetchYtData(handle) {
  if (!handle || ytLoading[handle]) return;
  ytLoading[handle] = true;
  try {
    const res = await fetch(`/api/youtube?handle=${encodeURIComponent(handle)}`);
    if (!res.ok) throw new Error('err');
    const data = await res.json();
    ytCache[handle] = data;
    saveYtCache();
    const k = handle.replace('@','');
    const se = document.getElementById('yt-s-'+k);
    const ae = document.getElementById('yt-a-'+k);
    if (se) se.textContent = fmtNum(data.subscribers);
    if (ae) ae.textContent = fmtNum(data.avgViews);
  } catch {} finally { ytLoading[handle] = false; }
}

function fmtNum(n) {
  if (!n || n===0) return '–';
  if (n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if (n >= 10000)     return (n/10000).toFixed(1).replace(/\.0$/,'')+'만';
  return n.toLocaleString('ko-KR');
}

async function loadAllYtData() {
  const btn = document.getElementById('ytLoadBtn');
  if (btn) { btn.textContent = '로딩 중...'; btn.disabled = true; }
  const handles = INFLUENCERS.filter(i => i.url).map(i => i.url.match(/@[^/?#\s]+/)?.[0]).filter(Boolean);
  const uncached = handles.filter(h => !ytCache[h]);
  for (let i = 0; i < uncached.length; i += 3) {
    await Promise.all(uncached.slice(i, i+3).map(h => fetchYtData(h)));
  }
  renderItems();
  if (btn) { btn.textContent = '↺ 데이터 새로고침'; btn.disabled = false; }
}

// ── FORMAT ──
const fmtKor = m => {
  const e = Math.floor(m/10000), r = m%10000;
  if (e>0 && r>0) return `${e}억 ${r.toLocaleString('ko-KR')}만원`;
  if (e>0) return `${e}억원`;
  return `${m.toLocaleString('ko-KR')}만원`;
};
const fmtWon = m => (m*10000).toLocaleString('ko-KR')+'원';
const fmtShort = m => {
  const e=Math.floor(m/10000), r=m%10000;
  if(e>0&&r>0) return `${e}억 ${r.toLocaleString()}만`;
  if(e>0) return `${e}억`;
  return `${m.toLocaleString()}만`;
};
const allTotal = () => Object.values(plan).flat().reduce((s,i) => s+i.priceVat, 0);

// ── HEADER ──
function updateHeader() {
  const budget = +document.getElementById('budgetInput').value || 10000;
  const total = allTotal(), remain = budget - total;
  const se = document.getElementById('hSpent'), re = document.getElementById('hRemain');
  se.textContent = fmtKor(total);
  se.className = 'hstat-val '+(total>budget?'over':'ok');
  re.textContent = fmtKor(remain);
  re.className = 'hstat-val '+(remain<0?'over':'ok');
}

// ── CAT TABS ──
function renderCatTabs() {
  document.getElementById('catTabs').innerHTML = CATS.map(c =>
    `<div class="cat-tab ${c.id===activeCat?'a-'+c.id:''}" onclick="setCat('${c.id}')">${c.label}</div>`
  ).join('');
  const isInf = activeCat==='inf';
  document.getElementById('searchWrap').style.display = isInf ? '' : 'none';
  document.getElementById('subFilter').style.display  = isInf ? 'flex' : 'none';
  document.getElementById('ytBtnWrap').style.display  = isInf ? '' : 'none';
}
function setCat(id) { activeCat=id; renderCatTabs(); renderItems(); }

// ── INF SUB FILTER ──
function renderSubFilter() {
  document.getElementById('subFilter').innerHTML = INF_SUBS.map(s =>
    `<span class="sf-chip ${s===activeInfSub?'on':''}" onclick="setInfSub('${s}')">${s}</span>`
  ).join('');
}
function setInfSub(s) { activeInfSub=s; renderSubFilter(); renderItems(); }

// ── ITEMS ──
function renderItems() {
  const el = document.getElementById('itemList');
  if (activeCat === 'inf') {
    const q = document.getElementById('infSearch').value.toLowerCase();
    const list = INFLUENCERS.filter(i => {
      const mq = i.name.toLowerCase().includes(q) || i.sub.toLowerCase().includes(q);
      const ms = activeInfSub==='전체' || i.sub===activeInfSub;
      return mq && ms;
    });
    el.innerHTML = list.length === 0
      ? '<div style="padding:28px;text-align:center;color:var(--text3);font-size:13px">검색 결과 없음</div>'
      : `<div class="inf-grid">${list.map(inf => {
        const handle = inf.url?.match(/@[^/?#\s]+/)?.[0]||'';
        const yt = handle ? ytCache[handle] : null;
        const subsTxt = yt ? fmtNum(yt.subscribers) : inf.subs||'–';
        const avgTxt  = yt ? fmtNum(yt.avgViews) : (ytLoading[handle]?'…':'–');
        const k = handle.replace('@','');
        const top2 = inf.prices.slice(0,2);
        return `
        <div class="inf-card" onclick="openModal('${inf.name}')">
          <div class="ic-top">
            <div class="ic-name">${inf.name}</div>
            <span class="ic-cat">${inf.sub}</span>
          </div>
          <div class="ic-meta">
            <span class="ic-subs" id="yt-s-${k}">구독 ${subsTxt}</span>
            <span class="ic-avg" id="yt-a-${k}">조회 ${avgTxt}</span>
          </div>
          <div class="ic-prices">
            ${top2.map(p=>`<div class="ic-price-row"><span class="ic-ptype">${p.t}</span><span class="ic-pval">${fmtShort(p.v)}</span></div>`).join('')}
          </div>
          ${inf.note?`<div class="ic-note">📌 ${inf.note}</div>`:''}
          <div class="ic-footer">
            ${inf.url?`<a href="${inf.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="ic-ch-btn">채널↗</a>`:''}
            <button class="ic-add-btn" onclick="event.stopPropagation();openModal('${inf.name}')">+ 추가</button>
          </div>
        </div>`;
      }).join('')}</div>`;
  } else {
    const items = FIXED_ITEMS[activeCat] || [];
    // Group by group label
    const groups = {};
    items.forEach((item, idx) => {
      const g = item.group || '기타';
      if (!groups[g]) groups[g] = [];
      groups[g].push({ item, idx });
    });
    const bgMap = { inf:'#eff6ff', amb:'#fff7ed', exp:'#f0fdf4', ad:'#f5f3ff', viral:'#fdf2f8' };
    const bg = bgMap[activeCat] || '#f5f5f7';
    let html = '<div class="fixed-list">';
    Object.entries(groups).forEach(([gName, entries]) => {
      if (Object.keys(groups).length > 1) html += `<div class="fixed-group-label">${gName}</div>`;
      entries.forEach(({item, idx}) => {
        const priceStr = item.mode==='per'
          ? `인당 ${item.defaultUnit}만`
          : `${item.defaultVal}만원`;
        html += `
        <div class="fli" onclick="openFModal('${activeCat}',${idx})">
          <div class="fli-icon" style="background:${bg}">${item.icon||'📌'}</div>
          <div class="fli-body">
            <div class="fli-name">${item.name}</div>
            <div class="fli-desc">${item.desc}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="fli-price">${priceStr}</div>
            <div class="fli-price-sub">VAT별도</div>
          </div>
          <button class="fli-add" onclick="event.stopPropagation();openFModal('${activeCat}',${idx})">+ 추가</button>
        </div>`;
      });
    });
    html += '</div>';
    el.innerHTML = html;
  }
}

// ── PPL MODAL ──
function openModal(name) {
  modalData = INFLUENCERS.find(i => i.name===name);
  document.getElementById('mName').textContent = modalData.name;
  document.getElementById('mSub').textContent  = modalData.sub;
  document.getElementById('mType').innerHTML   = modalData.prices.map(p =>
    `<option value="${p.v}">${p.t} — ${fmtKor(p.v)}</option>`).join('');
  document.getElementById('mMonth').innerHTML  = MONTHS.map(m =>
    `<option ${m===activeMonth?'selected':''}>${m}</option>`).join('');
  document.getElementById('mMemo').value = '';
  updateModalPrice();
  document.getElementById('overlay').classList.add('show');
}
function updateModalPrice() {
  const v = +document.getElementById('mType').value;
  document.getElementById('pbWon').textContent = fmtWon(v);
  document.getElementById('pbKor').textContent = fmtKor(v);
  document.getElementById('pbVat').textContent = fmtKor(Math.round(v*1.1));
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }
function addFromModal() {
  const te = document.getElementById('mType');
  const t = te.options[te.selectedIndex].text.split(' — ')[0];
  const v = +te.value, month = document.getElementById('mMonth').value;
  plan[month].push({ id:Date.now(), cat:'inf', name:modalData.name, type:t, price:v, priceVat:Math.round(v*1.1), memo:document.getElementById('mMemo').value });
  closeModal(); refresh();
}

// ── FIXED QUICK-ADD MODAL ──
function openFModal(catId, idx) {
  fModalCtx = { catId, idx };
  const item = FIXED_ITEMS[catId][idx];
  document.getElementById('fmName').textContent = item.name;
  document.getElementById('fmDesc').textContent = item.desc;
  document.getElementById('fmMemo').value = '';
  document.getElementById('fmMonth').innerHTML = MONTHS.map(m =>
    `<option ${m===activeMonth?'selected':''}>${m}</option>`).join('');

  let fields = '';
  if (item.mode === 'per') {
    fields = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div><label class="fm-fl">${item.countLabel}</label><input class="fm-input" id="fm-count" type="number" value="${item.defaultCount}" oninput="updateFPreview()"></div>
        <div><label class="fm-fl">${item.unitLabel}</label><input class="fm-input" id="fm-unit" type="number" value="${item.defaultUnit}" oninput="updateFPreview()"></div>
      </div>`;
  } else {
    fields = `<div style="margin-bottom:12px"><label class="fm-fl">${item.valLabel}</label><input class="fm-input" id="fm-val" type="number" value="${item.defaultVal}" oninput="updateFPreview()"></div>`;
  }
  document.getElementById('fmFields').innerHTML = fields;
  updateFPreview();
  document.getElementById('foverlay').classList.add('show');
}
function updateFPreview() {
  const { catId, idx } = fModalCtx || {};
  if (!catId) return;
  const item = FIXED_ITEMS[catId][idx];
  let price = 0;
  if (item.mode==='per') {
    price = (+document.getElementById('fm-count')?.value||0) * (+document.getElementById('fm-unit')?.value||0);
  } else {
    price = +document.getElementById('fm-val')?.value||0;
  }
  document.getElementById('fmPreview').textContent = fmtKor(Math.round(price*1.1));
}
function closeFModal() { document.getElementById('foverlay').classList.remove('show'); }
function addFixed() {
  const {catId, idx} = fModalCtx;
  const item = FIXED_ITEMS[catId][idx];
  const month = document.getElementById('fmMonth').value;
  const memo  = document.getElementById('fmMemo').value;
  let price, label;
  if (item.mode==='per') {
    const c = +document.getElementById('fm-count').value||0;
    const u = +document.getElementById('fm-unit').value||0;
    price = c*u; label = `${c.toLocaleString()}명 × ${u}만`;
  } else {
    price = +document.getElementById('fm-val').value||0;
    label = item.name;
  }
  plan[month].push({ id:Date.now(), cat:catId, name:item.name, type:label, price, priceVat:Math.round(price*1.1), memo });
  closeFModal(); refresh();
}

// ── MONTH TABS ──
function renderMonthTabs() {
  document.getElementById('monthTabs').innerHTML = MONTHS.map(m => {
    const t = plan[m].reduce((s,i) => s+i.priceVat, 0);
    return `<div class="m-tab ${m===activeMonth?'active':''}" onclick="setMonth('${m}')">
      ${m}${t>0?`<span class="m-badge">${fmtShort(t)}</span>`:''}
    </div>`;
  }).join('');
}
function setMonth(m) { activeMonth=m; renderMonthTabs(); renderRightBody(); }

// ── RIGHT BODY ──
function renderRightBody() {
  const items   = plan[activeMonth];
  const budget  = +document.getElementById('budgetInput').value||10000;
  const mVat    = items.reduce((s,i) => s+i.priceVat, 0);
  const mRaw    = items.reduce((s,i) => s+i.price, 0);
  const cum     = allTotal();
  const remain  = budget - cum;
  const pct     = Math.min(100, budget>0 ? Math.round(cum/budget*100):0);
  const barCol  = pct>=100?'#e03131':pct>=80?'#d9600a':'#5b4ef8';

  let html = `
  <div class="summary-row">
    <div class="sum-card">
      <div class="sum-label">${activeMonth} 집행 VAT별도</div>
      <div class="sum-val neu">${fmtKor(mRaw)}</div>
      <div class="sum-sub">${fmtWon(mRaw)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">${activeMonth} 집행 VAT포함</div>
      <div class="sum-val neu">${fmtKor(mVat)}</div>
      <div class="sum-sub">${fmtWon(mVat)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">전체 누적 VAT포함</div>
      <div class="sum-val ${cum>budget?'over':'neu'}">${fmtKor(cum)}</div>
      <div class="sum-sub">총예산의 ${pct}%</div>
    </div>
    <div class="sum-card" style="display:flex;flex-direction:column;justify-content:space-between">
      <div>
        <div class="sum-label">잔여 예산</div>
        <div class="sum-val ${remain<0?'over':'ok'}">${fmtKor(remain)}</div>
        <div class="sum-sub">${fmtWon(remain)}</div>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${barCol}"></div></div>
    </div>
  </div>`;

  CATS.forEach(cat => {
    const catItems = items.filter(i => i.cat===cat.id);
    const catVat   = catItems.reduce((s,i) => s+i.priceVat, 0);
    const catRaw   = catItems.reduce((s,i) => s+i.price, 0);
    const bgt      = catBudgets[cat.id]||0;
    const cpct     = bgt>0 ? Math.min(100, Math.round(catVat/bgt*100)) : 0;
    const fill     = bgt>0 ? Math.min(100, catVat/bgt*100) : 0;
    const pctCls   = cpct>=100?'over':cpct>=80?'warn':'ok';

    html += `
    <div class="plan-section">
      <div class="ps-head">
        <div class="ps-dot ${cat.dot}"></div>
        <span class="ps-name">${cat.label}</span>
        ${catItems.length>0?`<span class="ps-count">${catItems.length}건</span>`:''}
        <div class="ps-bar-wrap">
          <div class="ps-bar-track"><div class="ps-bar-fill" style="width:${fill}%;background:${cat.col}"></div></div>
        </div>
        <div class="ps-budget-area">
          ${catVat>0?`<span class="ps-spent">${fmtKor(catVat)}</span>`:''}
          ${bgt>0&&catVat>0?`<span class="ps-pct ${pctCls}">${cpct}%</span>`:''}
          <input class="ps-budget-input" type="number" value="${bgt}" placeholder="예산" title="카테고리 예산 (만원)" onchange="setCatBudget('${cat.id}',this.value)">
          <span class="ps-budget-unit">만원</span>
        </div>
      </div>
      <div class="ps-items">
        ${catItems.length===0
          ? `<div class="ps-empty">← 왼쪽 [${cat.label}] 탭에서 추가하세요</div>`
          : catItems.map(i => `
            <div class="plan-item">
              <div class="pi-avatar">${i.name[0]}</div>
              <div class="pi-info">
                <div class="pi-name">${i.name}</div>
                <span class="pi-type ${cat.pill}">${i.type}</span>
              </div>
              <div class="pi-prices">
                <div class="pi-vat">${fmtKor(i.priceVat)}</div>
                <div class="pi-raw">${fmtWon(i.price)}</div>
              </div>
              <input class="pi-memo" value="${i.memo}" placeholder="메모..." onchange="updateMemo('${activeMonth}',${i.id},this.value)">
              <button class="pi-del" onclick="delItem('${activeMonth}',${i.id})">✕</button>
            </div>`).join('')
        }
      </div>
      ${catItems.length>0 ? `
      <div class="ps-subtotal">
        <span class="ps-subtotal-label">소계</span>
        <div style="display:flex;gap:8px;align-items:baseline">
          <span class="ps-subtotal-val">${fmtKor(catVat)}</span>
          <span class="ps-subtotal-sub">${fmtWon(catRaw)} VAT별도</span>
        </div>
      </div>` : ''}
    </div>`;
  });

  document.getElementById('rightBody').innerHTML = html;
}

function delItem(month, id) {
  plan[month] = plan[month].filter(i => i.id!==id);
  refresh();
}
function updateMemo(month, id, val) {
  const item = plan[month].find(i => i.id===id);
  if (item) item.memo = val;
}
function refresh() { renderMonthTabs(); renderRightBody(); updateHeader(); }

// ── INIT ──
document.getElementById('budgetInput').addEventListener('input', refresh);
document.getElementById('overlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.getElementById('foverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeFModal(); });

loadYtCache();
loadCatBudgets();
renderCatTabs();
renderSubFilter();
renderItems();
renderMonthTabs();
renderRightBody();
updateHeader();
</script>
</body>
</html>
